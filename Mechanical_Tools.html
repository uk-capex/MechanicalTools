<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>焼き嵌め／冷やし嵌め 計算ツール</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c1117;
    --surface: #161b22;
    --surface2: #1c2230;
    --border: #2a3444;
    --ink: #cdd9e5;
    --muted: #768390;
    --accent: #388bfd;
    --accent-dim: #1c3a6b;
    --good: #3fb950;
    --good-dim: #0f2d17;
    --warn: #d29922;
    --warn-dim: #2e2009;
    --bad: #f85149;
    --bad-dim: #3b1016;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 14px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── ヘッダー ── */
  header {
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
  }
  header h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    letter-spacing: .02em;
  }
  .badge {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid;
  }
  .badge-green { border-color: var(--good); color: var(--good); }
  .badge-blue  { border-color: var(--accent); color: var(--accent); }

  /* ── メインレイアウト ── */
  .layout {
    display: grid;
    grid-template-columns: 360px 1fr;
    flex: 1;
    min-height: 0;
  }

  /* ── 左パネル（入力） ── */
  .panel-left {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .field { margin-bottom: 10px; }
  .field label {
    display: block;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 4px;
  }

  input[type="number"], select {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--ink);
    padding: 7px 10px;
    font-size: 14px;
    font-family: 'JetBrains Mono', monospace;
    outline: none;
    transition: border-color .15s;
  }
  input[type="number"]:focus, select:focus {
    border-color: var(--accent);
  }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .divider { border: none; border-top: 1px solid var(--border); }

  /* ── 右パネル（結果） ── */
  .panel-right {
    padding: 24px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── 結果カード ── */
  .result-cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .card .card-label {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .card .card-value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 22px;
    font-weight: 600;
    line-height: 1;
    color: var(--ink);
  }
  .card .card-unit {
    font-size: 12px;
    color: var(--muted);
    margin-left: 2px;
  }
  .card.good { border-color: var(--good); background: var(--good-dim); }
  .card.warn { border-color: var(--warn); background: var(--warn-dim); }
  .card.bad  { border-color: var(--bad);  background: var(--bad-dim);  }

  .card .card-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── 判定バー ── */
  .verdict-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
  }
  .verdict-icon {
    font-size: 22px;
    line-height: 1;
  }
  .verdict-text { flex: 1; }
  .verdict-text .vt-main { font-weight: 700; font-size: 15px; }
  .verdict-text .vt-sub  { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .verdict-bar.good { border-color: var(--good); }
  .verdict-bar.warn { border-color: var(--warn); }
  .verdict-bar.bad  { border-color: var(--bad);  }

  /* ── 詳細テーブル ── */
  .detail-section { }
  .detail-section .section-title { margin-bottom: 10px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  tr { border-bottom: 1px solid var(--border); }
  tr:last-child { border-bottom: none; }
  td {
    padding: 8px 6px;
    vertical-align: middle;
  }
  td:first-child { color: var(--muted); width: 58%; }
  td:last-child {
    font-family: 'JetBrains Mono', monospace;
    text-align: right;
    color: var(--ink);
    font-weight: 600;
  }
  .highlight-row td { color: var(--accent); }

  /* ── 逆算セクション ── */
  .reverse-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .reverse-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .reverse-item .ri-label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .reverse-item .ri-val {
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    font-weight: 600;
  }
  .reverse-item .ri-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* ── メモ欄 ── */
  .memo {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }
  .memo b { color: var(--ink); }

  /* ── レスポンシブ ── */
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    .panel-left { border-right: none; border-bottom: 1px solid var(--border); }
    .result-cards { grid-template-columns: 1fr 1fr; }
    .reverse-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 500px) {
    .result-cards { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>焼き嵌め / 冷やし嵌め 計算ツール</h1>
  <span class="badge badge-green">自動計算</span>
  <span class="badge badge-blue">オフライン</span>
</header>

<div class="layout">
  <!-- ════ 左：入力 ════ -->
  <div class="panel-left">

    <div>
      <div class="section-title">基本寸法</div>
      <div class="field">
        <label>呼び径 D (mm)</label>
        <input id="D" type="number" step="0.001" value="50">
      </div>
      <div class="two-col">
        <div class="field">
          <label>狙い締め代 δ (mm)</label>
          <input id="delta" type="number" step="0.001" value="0.025">
        </div>
        <div class="field">
          <label>組立マージン (mm)</label>
          <input id="margin" type="number" step="0.001" value="0.02">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div>
      <div class="section-title">材料 — 穴側</div>
      <div class="field">
        <label>材料プリセット</label>
        <select id="alphaH_select">
          <option value="12e-6">鋼・S45C（12×10⁻⁶ /℃）</option>
          <option value="10.5e-6">ねずみ鋳鉄（10.5×10⁻⁶ /℃）</option>
          <option value="17e-6">SUS系（17×10⁻⁶ /℃）</option>
          <option value="23e-6">アルミ（23×10⁻⁶ /℃）</option>
          <option value="20.5e-6">真鍮（20.5×10⁻⁶ /℃）</option>
          <option value="custom">カスタム入力</option>
        </select>
      </div>
      <div class="field" id="alphaH_wrap" style="display:none">
        <label>α穴 カスタム値 (/℃)</label>
        <input id="alphaH" type="number" step="1e-7" value="12e-6">
      </div>
      <div class="two-col">
        <div class="field">
          <label>初期温度 (℃)</label>
          <input id="TH0" type="number" step="1" value="20">
        </div>
        <div class="field">
          <label>組立温度 (℃)</label>
          <input id="THt" type="number" step="1" value="200">
        </div>
      </div>
    </div>

    <hr class="divider">

    <div>
      <div class="section-title">材料 — 軸側</div>
      <div class="field">
        <label>材料プリセット</label>
        <select id="alphaS_select">
          <option value="12e-6">鋼・S45C（12×10⁻⁶ /℃）</option>
          <option value="10.5e-6">ねずみ鋳鉄（10.5×10⁻⁶ /℃）</option>
          <option value="17e-6">SUS系（17×10⁻⁶ /℃）</option>
          <option value="23e-6">アルミ（23×10⁻⁶ /℃）</option>
          <option value="20.5e-6">真鍮（20.5×10⁻⁶ /℃）</option>
          <option value="custom">カスタム入力</option>
        </select>
      </div>
      <div class="field" id="alphaS_wrap" style="display:none">
        <label>α軸 カスタム値 (/℃)</label>
        <input id="alphaS" type="number" step="1e-7" value="12e-6">
      </div>
      <div class="two-col">
        <div class="field">
          <label>初期温度 (℃)</label>
          <input id="TS0" type="number" step="1" value="20">
        </div>
        <div class="field">
          <label>組立温度 (℃)</label>
          <input id="TSt" type="number" step="1" value="20">
        </div>
      </div>
    </div>

  </div>

  <!-- ════ 右：結果 ════ -->
  <div class="panel-right">

    <!-- 判定 -->
    <div id="verdict-bar" class="verdict-bar">
      <div class="verdict-icon" id="verdict-icon">—</div>
      <div class="verdict-text">
        <div class="vt-main" id="verdict-main">計算中...</div>
        <div class="vt-sub"  id="verdict-sub"></div>
      </div>
    </div>

    <!-- サマリーカード -->
    <div class="result-cards">
      <div class="card">
        <div class="card-label">組立時クリアランス</div>
        <div class="card-value" id="r-clear">—<span class="card-unit">mm</span></div>
        <div class="card-sub" id="r-clear-sub"></div>
      </div>
      <div class="card">
        <div class="card-label">穴の拡大量 ΔD穴</div>
        <div class="card-value" id="r-dhole">—<span class="card-unit">mm</span></div>
        <div class="card-sub" id="r-dhole-sub"></div>
      </div>
      <div class="card">
        <div class="card-label">軸の縮小量 ΔD軸</div>
        <div class="card-value" id="r-dshaft">—<span class="card-unit">mm</span></div>
        <div class="card-sub" id="r-dshaft-sub"></div>
      </div>
    </div>

    <!-- 詳細 -->
    <div class="detail-section">
      <div class="section-title">計算詳細</div>
      <div class="card">
        <table id="detail-table">
          <tbody></tbody>
        </table>
      </div>
    </div>

    <!-- 逆算 -->
    <div>
      <div class="section-title">片側のみで達成する場合の必要温度差</div>
      <div class="reverse-grid">
        <div class="reverse-item">
          <div class="ri-label">穴のみ加熱（軸は常温）</div>
          <div class="ri-val" id="rev-hole">—</div>
          <div class="ri-sub" id="rev-hole-sub"></div>
        </div>
        <div class="reverse-item">
          <div class="ri-label">軸のみ冷却（穴は常温）</div>
          <div class="ri-val" id="rev-shaft">—</div>
          <div class="ri-sub" id="rev-shaft-sub"></div>
        </div>
      </div>
    </div>

    <!-- メモ -->
    <div class="memo" id="memo-area"></div>

  </div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const fmt = (n, d=3) => Number(n).toFixed(d);

  // ─── カスタム入力トグル ───
  function bindSelect(selId, wrapId, numId) {
    const sel  = $(selId);
    const wrap = $(wrapId);
    const num  = $(numId);
    const sync = () => {
      if (sel.value === 'custom') {
        wrap.style.display = '';
        num.disabled = false;
      } else {
        wrap.style.display = 'none';
        num.disabled = true;
        num.value = sel.value;
      }
      compute();
    };
    sel.addEventListener('change', sync);
    sync();
  }
  bindSelect('alphaH_select', 'alphaH_wrap', 'alphaH');
  bindSelect('alphaS_select', 'alphaS_wrap', 'alphaS');

  // ─── 自動計算トリガー ───
  ['D','delta','margin','alphaH','alphaS','TH0','THt','TS0','TSt'].forEach(id => {
    $(id).addEventListener('input', compute);
  });

  function setCard(id, value, unit='mm', sub='') {
    const el = $(id);
    el.innerHTML = `${value}<span class="card-unit"> ${unit}</span>`;
    $(id + '-sub').textContent = sub;
  }

  function compute() {
    const D      = +$('D').value;
    const alphaH = $('alphaH_select').value === 'custom' ? +$('alphaH').value : +$('alphaH_select').value;
    const alphaS = $('alphaS_select').value === 'custom' ? +$('alphaS').value : +$('alphaS_select').value;
    const delta  = +$('delta').value;
    const margin = +$('margin').value;
    const TH0    = +$('TH0').value;
    const THt    = +$('THt').value;
    const TS0    = +$('TS0').value;
    const TSt    = +$('TSt').value;

    if ([D,alphaH,alphaS,delta,margin,TH0,THt,TS0,TSt].some(v => isNaN(v) || v === '')) return;

    const dHole   = alphaH * D * (THt - TH0);     // 穴拡大
    const dShaft  = alphaS * D * (TS0 - TSt);      // 軸縮小
    const effClear = dHole + dShaft;               // 組立時クリアランス
    const reqClear = delta + margin;               // 必要クリアランス
    const surplus  = effClear - reqClear;          // 余剰（+が余裕）

    const needDT_hole  = reqClear / (alphaH * D);
    const needDT_shaft = reqClear / (alphaS * D);

    // 判定
    let verdictClass, verdictIcon, verdictMain, verdictSub;
    if (surplus >= 0.02) {
      verdictClass = 'good'; verdictIcon = '✓';
      verdictMain  = 'クリアランス十分 — 組立可能';
      verdictSub   = `余剰 ${fmt(surplus)} mm の余裕あり。安定して組み立てられます。`;
    } else if (surplus >= 0) {
      verdictClass = 'warn'; verdictIcon = '△';
      verdictMain  = 'ギリギリ OK — 余裕は少ない';
      verdictSub   = `余剰 ${fmt(surplus)} mm。作業時間・部品質量によっては温度が足りないことも。`;
    } else {
      verdictClass = 'bad'; verdictIcon = '✕';
      verdictMain  = 'クリアランス不足 — 温度を上げてください';
      verdictSub   = `不足 ${fmt(Math.abs(surplus))} mm。穴をもっと加熱するか軸を冷却してください。`;
    }

    const vbar = $('verdict-bar');
    vbar.className = `verdict-bar ${verdictClass}`;
    $('verdict-icon').textContent = verdictIcon;
    $('verdict-main').textContent = verdictMain;
    $('verdict-sub').textContent  = verdictSub;

    // カード
    setCard('r-clear',  fmt(effClear), 'mm', `必要 ${fmt(reqClear)} mm`);
    setCard('r-dhole',  fmt(dHole),    'mm', `ΔT = ${fmt(THt - TH0, 0)} ℃`);
    setCard('r-dshaft', fmt(dShaft),   'mm', `ΔT = ${fmt(TS0 - TSt, 0)} ℃`);

    // 詳細テーブル
    const rows = [
      ['呼び径 D', `${fmt(D, 3)} mm`],
      ['穴の膨張係数 α穴', alphaH.toExponential(2) + ' /℃'],
      ['軸の膨張係数 α軸', alphaS.toExponential(2) + ' /℃'],
      ['穴拡大量 ΔD穴', `${fmt(dHole, 4)} mm`],
      ['軸縮小量 ΔD軸', `${fmt(dShaft, 4)} mm`],
      ['組立時クリアランス', `${fmt(effClear, 4)} mm`],
      ['必要クリアランス (δ+M)', `${fmt(reqClear, 4)} mm`],
      ['余剰クリアランス', `${fmt(surplus, 4)} mm`],
    ];
    const tbody = document.querySelector('#detail-table tbody');
    tbody.innerHTML = rows.map((r, i) =>
      `<tr${i === rows.length - 1 ? ' class="highlight-row"' : ''}><td>${r[0]}</td><td>${r[1]}</td></tr>`
    ).join('');

    // 逆算
    $('rev-hole').textContent = `+ ${fmt(needDT_hole, 0)} ℃`;
    $('rev-hole-sub').textContent = `例）20℃ → ${fmt(20 + needDT_hole, 0)} ℃`;
    $('rev-shaft').textContent = `− ${fmt(needDT_shaft, 0)} ℃`;
    $('rev-shaft-sub').textContent = `例）20℃ → ${fmt(20 - needDT_shaft, 0)} ℃`;

    // 実務メモ
    let rec = '';
    if      (D < 30)  rec = 'δ 0.01〜0.02 mm（軽め）';
    else if (D < 60)  rec = 'δ 0.02〜0.03 mm（標準）';
    else if (D < 100) rec = 'δ 0.025〜0.04 mm（やや強め）';
    else               rec = 'δ 0.03〜0.05 mm（用途次第）';

    const LN2_shrink = alphaS * D * 216;

    $('memo-area').innerHTML = `
      <b>実務メモ</b><br>
      この径の推奨締め代の目安：<b>${rec}</b><br>
      液体窒素（20℃ → −196℃）で軸を冷却した場合の収縮量：<b>${fmt(LN2_shrink, 3)} mm</b><br>
      両側温調（穴加熱＋軸冷却）は必要温度差が小さく済むため、歪み・焼戻し・安全面でメリットあり。
    `;
  }

  compute();
</script>
</body>
</html>
