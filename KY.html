<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>非定常作業KY（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF0EE; --card:#FFFFFF; --ink:#1C2124; --sub:#5B6469; --line:#C7CCCE;
  --unseen:#E0A800; --unseen-bg:#FFF6D6; --nonec:#4F7DB3; --none-bg:#E5EDF7; --hit:#D22A1F; --hit-bg:#FBE4E2; --done:#1B8A4C; --done-bg:#E1F2E8;
  --caution:#F0B400; --caution-bg:#FFF4CC; --act:#1D5FA8; --act-ink:#FFFFFF; --none:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#151A1C; --card:#20272A; --ink:#E6EBED; --sub:#9AA5AA; --line:#3A4448;
  --unseen:#D9A925; --unseen-bg:#3A3215; --nonec:#7FA7D6; --none-bg:#1C2A3A; --hit:#F0574C; --hit-bg:#3D1F1C; --done:#3DBE74; --done-bg:#16301F;
  --caution:#F5C431; --caution-bg:#3A3215; --act:#4A8EDB; --act-ink:#0E1517; --none:#20272A;}}
:root[data-theme="dark"]{
  --paper:#151A1C; --card:#20272A; --ink:#E6EBED; --sub:#9AA5AA; --line:#3A4448;
  --unseen:#D9A925; --unseen-bg:#3A3215; --nonec:#7FA7D6; --none-bg:#1C2A3A; --hit:#F0574C; --hit-bg:#3D1F1C; --done:#3DBE74; --done-bg:#16301F;
  --caution:#F5C431; --caution-bg:#3A3215; --act:#4A8EDB; --act-ink:#0E1517; --none:#20272A;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"BIZ UDPGothic","Meiryo UI","Hiragino Sans","Yu Gothic",sans-serif;font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ttl{font-weight:700;font-size:17px}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.steps{display:flex;gap:4px;margin-top:8px}
.steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--ink)}
h2{font-size:20px;margin:22px 0 4px}
.lead{color:var(--sub);font-size:14px;margin:0 0 14px}
label.f{display:block;font-size:14px;font-weight:700;margin:14px 0 6px}
input[type=text],textarea{width:100%;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--act);outline-offset:1px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font:inherit;font-size:15px;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:42px}
.opt.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grp{margin-top:18px}
.grp>.gl{font-size:13px;color:var(--sub);margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));z-index:6}
.bar .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:center}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:13px 16px;min-height:50px;cursor:pointer}
.btn.main{flex:1;background:var(--act);color:var(--act-ink)}
.btn.main:disabled{background:var(--line);color:var(--sub);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.hint{font-size:13px;color:var(--sub)}
.warn{font-size:14px;color:var(--hit);font-weight:700}
/* 関所 */
.gate{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.gate.no{border-color:var(--caution);background:var(--caution-bg)}
.gate.stop{border-color:var(--hit);background:var(--hit-bg)}
.gq{font-weight:700;margin-bottom:8px}
.yn{display:flex;gap:8px}
.yn button{flex:1;font:inherit;font-weight:700;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);min-height:46px;cursor:pointer}
.yn button.y.sel{background:var(--done);border-color:var(--done);color:#fff}
.yn button.n.sel{background:var(--caution);border-color:var(--caution);color:#1C2124}
.gsub{margin-top:10px}
.gsub .gl{font-size:13px;color:var(--sub);margin:8px 0 6px}
/* ハブ */
.tape{display:flex;gap:2px;height:14px;margin:12px 0 4px;border-radius:3px;overflow:hidden}
.tape b{flex:1;background:var(--unseen);transition:background .25s}
.tape b.hit{background:var(--hit)} .tape b.done{background:var(--done)} .tape b.none{background:var(--nonec)}
.tally{display:flex;gap:14px;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tally span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;background:var(--c)}
.band{margin-top:16px}
.band .gl{font-size:13px;color:var(--sub);margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.chip{position:relative;font:inherit;text-align:left;padding:11px 12px;border-radius:10px;border:2px solid var(--unseen);background:var(--card);color:var(--ink);min-height:64px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.chip .nm{font-weight:700;font-size:15px;line-height:1.3;display:block}
.chip .st{font-size:12px;color:var(--sub);display:block;margin-top:3px}
.chip.unseen{border-style:dashed;background:var(--unseen-bg)}
.chip.unseen .st{color:#8A6A00;font-weight:700}
.chip.hit{border-color:var(--hit);background:var(--hit-bg)}
.chip.hit .st{color:var(--hit);font-weight:700}
.chip.done{border-color:var(--done);background:var(--done-bg)}
.chip.done .st{color:var(--done);font-weight:700}
.chip.none{border-color:var(--nonec);background:var(--none-bg)}
.chip.none .st{color:var(--nonec);font-weight:700}
.chip.add{border-style:dashed;border-color:var(--act);color:var(--act);display:flex;align-items:center;justify-content:center;font-weight:700}
.chip.pressing{transform:scale(.97)}
/* シート */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--paper);border-radius:16px 16px 0 0;max-height:88%;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .22s ease}
.sheet.open{transform:none}
.sheet .in{max-width:560px;margin:0 auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.fear{background:var(--hit-bg);border-left:4px solid var(--hit);padding:10px 12px;border-radius:6px;margin:10px 0 4px;font-weight:700}
.memo{font-size:12px;color:var(--hit);margin-top:4px}
.mgrp{margin-top:14px}
.mgrp .gl{font-size:13px;color:var(--sub);margin-bottom:6px}
.opt.m.sel{background:var(--done);border-color:var(--done);color:#fff}
.nudge{margin-top:12px;background:var(--caution-bg);border:1.5px solid var(--caution);border-radius:8px;padding:9px 11px;font-size:14px}
.row2{display:flex;gap:8px;margin-top:16px}
.row2 .btn{flex:1}
.btn.none{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ok{background:var(--done);color:#fff}
.btn.ok:disabled{background:var(--line);color:var(--sub)}
/* 締め・記録 */
.pick{display:block;width:100%;text-align:left;font:inherit;padding:11px 12px;margin-bottom:8px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pick.sel{border-color:var(--hit);background:var(--hit-bg)}
.pick small{display:block;color:var(--sub);font-size:12px}
.big-q{font-size:26px;font-weight:700;text-align:center;margin:30px 0 18px}
.judge .opt{flex:1 1 45%;justify-content:center;text-align:center;border-radius:10px}
.judge .opt.sel.r0{background:var(--done);border-color:var(--done);color:#fff}
.judge .opt.sel.r1{background:var(--caution);border-color:var(--caution);color:#1C2124}
.judge .opt.sel.r2,.judge .opt.sel.r3{background:var(--hit);border-color:var(--hit);color:#fff}
.must{background:var(--caution-bg);border:1.5px solid var(--caution);border-radius:8px;padding:9px 11px;font-size:14px;margin:8px 0}
.rec{background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:14px;font-size:14px}
.rec dt{color:var(--sub);font-size:12px;margin-top:10px}
.rec dt:first-child{margin-top:0}
.rec dd{margin:2px 0 0}
.past{background:var(--caution-bg);border:1.5px solid var(--caution);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:14px}
.past b{display:block;margin-bottom:4px}
.hist{margin-top:28px}
.hitem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:14px}
.hitem .meta{color:var(--sub);font-size:12px}
.linkbtn{font:inherit;font-size:13px;background:none;border:0;color:var(--act);padding:4px 0;cursor:pointer;text-decoration:underline}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.unseen .st{color:var(--unseen)}}
:root[data-theme="dark"] .chip.unseen .st{color:var(--unseen)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="toprow"><span class="ttl" id="ttl">非定常作業KY</span><span class="clock" id="clock"></span></div>
    <div class="steps" id="steps"></div>
  </header>
  <main id="main"></main>
</div>
<div class="bar"><div class="in" id="bar"></div></div>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet"><div class="in" id="sheetIn"></div></div>
<div class="toast" id="toast"></div>
<script>

function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1600)}
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")}

function selected(){const a=[];if(S.W)a.push(S.W);S.T.forEach(x=>a.push(x));S.K.forEach(x=>a.push(x));return a}
function buildChips(){
  const red=new Set,show=new Set;
  selected().forEach(s=>{const m=D.M[s];if(!m)return;m.red.forEach(i=>red.add(i));m.show.forEach(i=>show.add(i))});
  const next={};
  D.chips.forEach(c=>{
    if(!red.has(c.id)&&!show.has(c.id))return;
    const old=S.chips[c.id];
    next[c.id]=old?Object.assign(old,{dflt:red.has(c.id)}):{state:red.has(c.id)?"hit":"unseen",dflt:red.has(c.id),sel:[],note:""};
  });
  S.chips=next;
}
function gateItems(){
  const w=S.W||"";
  return D.G.filter(g=>{
    if(g.scope==="全部")return true;
    if(g.scope==="運搬以外全部")return w!=="運搬・搬入出";
    if(g.scope==="運搬・火気以外")return w!=="運搬・搬入出"&&!w.startsWith("火気");
    return true});
}
function chipList(){return Object.keys(S.chips).map(id=>Object.assign({id},CH[id],S.chips[id]))}
function counts(){const c={unseen:0,hit:0,done:0,none:0};chipList().forEach(x=>c[x.state]++);S.custom.forEach(()=>c.done++);return c}

/* ---------- 画面 ---------- */
function go(step){S.step=step;render();window.scrollTo(0,0)}
function render(){

  return loadH().filter(r=>r.equip===equip.trim()&&r.after&&r.after.had).slice(-3).reverse();
}

function optBtns(list,isSel,cls=""){return list.map(x=>`<button class="opt ${cls} ${isSel(x)?"sel":""}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}
function vSelect(){
  $("#main").innerHTML=`
  <h2>何をする？どこで？</h2>
  <p class="lead">選んだ内容に合わせて、確認するチップが出てきます。</p>
  <div class="grp"><div class="gl">作業（1つ）</div><div class="opts" id="oW">${optBtns(D.W,x=>S.W===x)}</div></div>
  <div class="grp"><div class="gl">対象設備（いくつでも）</div><div class="opts" id="oT">${optBtns(D.T,x=>S.T.has(x))}</div></div>
  <div class="grp"><div class="gl">条件（当てはまるものを全部）</div><div class="opts" id="oK">${optBtns(D.K,x=>S.K.has(x))}</div></div>`;
  $("#oW").onclick=e=>{const b=e.target.closest(".opt");if(!b)return;S.W=b.dataset.v;vSelect()};
  [["#oT",S.T],["#oK",S.K]].forEach(([id,set])=>$(id).onclick=e=>{const b=e.target.closest(".opt");if(!b)return;const v=b.dataset.v;set.has(v)?set.delete(v):set.add(v);b.classList.toggle("sel")});
  bar(`<button class="btn ghost" id="bk">戻る</button><button class="btn main" id="nx" ${S.W?"":"disabled"}>確認へ</button>`);
  $("#bk").onclick=()=>go("start");
  $("#nx").onclick=()=>{buildChips();go("gate")};
}
function gateState(){
  const items=gateItems();let ok=true,stop=false,anyNo=false;
  items.forEach(g=>{const a=S.gate[g.id];
    if(!a||!a.ans){ok=false;return}
    if(a.ans==="no"){anyNo=true;if(g.id==="G07"){stop=true;ok=false;return}
      if(!a.reason||!a.alts.length)ok=false}});
  return{ok,stop,anyNo};
}
function vGate(){
  const items=gateItems();
  $("#main").innerHTML=`
  <h2>まず、ここを確認</h2>
  <p class="lead">できないものは「いいえ」で大丈夫。理由と代わりの措置を選んでください。いいえがあると職制判断が必要になります。</p>
  ${items.map(g=>{const a=S.gate[g.id]||{};const no=a.ans==="no";const stop=no&&g.id==="G07";
    return`<div class="gate ${stop?"stop":no?"no":""}" data-g="${g.id}">
    <div class="gq">${esc(g.q)}</div>
    <div class="yn"><button class="y ${a.ans==="yes"?"sel":""}" data-a="yes">はい</button><button class="n ${no?"sel":""}" data-a="no">いいえ</button></div>
    ${stop?`<div class="gsub warn">保護具が揃うまで作業しない。揃えてから「はい」にしてください。</div>`:no?`<div class="gsub">
      <div class="gl">できない理由</div><div class="opts" data-k="reason">${g.reasons.map(r=>`<button class="opt ${a.reason===r?"sel":""}" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div>
      <div class="gl">代わりにやること（1つ以上）</div><div class="opts" data-k="alts">${g.alts.map(r=>`<button class="opt m ${a.alts.includes(r)?"sel":""}" data-v="${esc(r)}">${esc(r)}</button>`).join("")}</div></div>`:""}
    </div>`}).join("")}`;
  $("#main").onclick=e=>{
    const card=e.target.closest(".gate");if(!card)return;const id=card.dataset.g;
    const a=S.gate[id]||(S.gate[id]={ans:null,reason:null,alts:[]});
    const yn=e.target.closest(".yn button");
    if(yn){a.ans=yn.dataset.a;vGate();return}
    const o=e.target.closest(".opt");if(!o)return;const k=o.parentElement.dataset.k,v=o.dataset.v;

  };

  $("#bk").onclick=()=>{$("#main").onclick=null;go("select")};
  $("#nx").onclick=()=>{$("#main").onclick=null;go("hub")};
}

  document.querySelectorAll(".chip[data-id]").forEach(bindChip);

  $("#addC").onclick=()=>customSheet(-1);

    :`<button class="btn main" id="nx" ${ready?"":"disabled"}>${ready?"見回り完了":"赤があと "+c.hit}</button>`));
  $("#bk").onclick=()=>go("gate");
  if(bulk)$("#bulk").onclick=bulkSheet;else $("#nx").onclick=()=>go("close");
}
function chipHtml(x){
  const st={unseen:"未確認",hit:"対策を選ぶ",done:"対策済 "+x.sel.length,none:"該当なし"}[x.state];
  return`<button class="chip ${x.state}" data-id="${x.id}"><span class="nm">${esc(x.name)}</span><span class="st">${st}</span></button>`;
}
function bindChip(b){
  const id=b.dataset.id;let t=null,long=false;
  const start=()=>{long=false;b.classList.add("pressing");t=setTimeout(()=>{long=true;b.classList.remove("pressing");quickNone(id)},550)};
  const end=()=>{clearTimeout(t);b.classList.remove("pressing")};
  b.addEventListener("pointerdown",start);
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,end));
  b.addEventListener("contextmenu",e=>e.preventDefault());
  b.addEventListener("click",e=>{if(long){e.preventDefault();return}chipSheet(id)});
}
function bulkSheet(){
  const rest=chipList().filter(x=>x.state==="unseen");
  openSheet(`<h3>この${rest.length}個、本当に関係ない？</h3>
  <p class="hint">気になるものがあれば、やめてタップで中を見てください。</p>
  <div class="opts" style="margin-top:10px">${rest.map(x=>`<span class="opt" style="cursor:default">${esc(x.name)}</span>`).join("")}</div>
  <div class="row2"><button class="btn none" id="bC">やめる</button><button class="btn ok" id="bOk">全部該当なし</button></div>`);
  $("#bC").onclick=closeSheet;
  $("#bOk").onclick=()=>{rest.forEach(x=>{const s=S.chips[x.id];s.state="none";s.bulk=true});closeSheet();vHub()};
}
function quickNone(id){
  const s=S.chips[id];
  if(s.dflt){toast("赤のチップは中を見てください");if(navigator.vibrate)navigator.vibrate(40);return}
  if(s.state==="unseen"){s.state="none";s.bulk=false;toast("該当なしにしました")}
  else if(s.state==="none"){s.state="unseen";toast("未確認に戻しました")}
  else return;
  if(navigator.vibrate)navigator.vibrate(20);
  vHub();
}
function openSheet(html){$("#sheetIn").innerHTML=html;$("#sheetBg").style.display="block";requestAnimationFrame(()=>$("#sheet").classList.add("open"));$("#sheet").scrollTop=0}
function closeSheet(){$("#sheet").classList.remove("open");$("#sheetBg").style.display="none"}
$("#sheetBg").onclick=closeSheet;
function chipSheet(id){
  const c=CH[id],s=S.chips[id];let sel=[...s.sel],note=s.note,noneMode=false;
  const draw=()=>{
    const onlyProtect=sel.length>0&&sel.every(v=>c.c[3][1].includes(v));
    openSheet(`
    <h3>${esc(c.name)}</h3>
    <div class="fear">${esc(c.fear)}</div>
    ${c.memo?`<div class="memo">${esc(c.memo)}</div>`:""}
    ${c.c.filter(g=>g[1].length).map(g=>`<div class="mgrp"><div class="gl">${g[0]}</div><div class="opts">${g[1].map(o=>`<button class="opt m ${sel.includes(o)?"sel":""}" data-v="${esc(o)}">${esc(o)}</button>`).join("")}</div></div>`).join("")}
    <label class="f" for="cn">ほかにやること（任意）</label><input type="text" id="cn" value="${esc(note)}" placeholder="自由に一言">
    ${onlyProtect?`<div class="nudge">保護具だけで大丈夫？　止める・離す対策が取れないか一度考えてみてください。</div>`:""}
    ${noneMode?`<div class="must">最初から赤のチップです。該当しない理由を一言書いてください。</div><input type="text" id="nr" placeholder="例：この作業では電気に触れない">`:""}
    ${s.state==="done"||s.state==="none"?`<button class="linkbtn" id="sReset" style="margin-top:12px">${s.dflt?"赤":"未確認"}に戻す</button>`:""}
    <div class="row2">
      <button class="btn none" id="sNone">${noneMode?"理由を書いて該当なし":"該当なし"}</button>
      <button class="btn ok" id="sOk" ${sel.length||note.trim()?"":"disabled"}>対策OK</button>
    </div>`);
    $("#sheetIn").querySelectorAll(".opt.m").forEach(o=>o.onclick=()=>{const v=o.dataset.v;sel.includes(v)?sel.splice(sel.indexOf(v),1):sel.push(v);note=$("#cn").value;draw()});
    $("#cn").oninput=e=>{note=e.target.value;$("#sOk").disabled=!(sel.length||note.trim())};
    $("#sNone").onclick=()=>{
      if(s.dflt&&!noneMode){noneMode=true;note=$("#cn").value;draw();$("#nr").focus();return}
      if(s.dflt){const r=$("#nr").value.trim();if(!r){toast("理由を書いてください");return}s.noneReason=r}
      s.state="none";s.bulk=false;s.sel=[];s.note="";closeSheet();vHub()};
    if($("#sReset"))$("#sReset").onclick=()=>{s.state=s.dflt?"hit":"unseen";s.bulk=false;s.sel=[];s.note="";delete s.noneReason;closeSheet();vHub()};
    $("#sOk").onclick=()=>{s.bulk=false;s.sel=sel;s.note=note.trim();s.state="done";closeSheet();vHub()};
  };
  draw();
}
function customSheet(k){
  const u=k>=0?S.custom[k]:{name:"",fear:"",measure:""};
  openSheet(`<h3>想定外を追加</h3><p class="hint">リストにない危険を見つけたら書いてください。記録に残って、次の人の参考になります。</p>
  <label class="f" for="un">何が危ない？</label><input type="text" id="un" value="${esc(u.name)}" placeholder="例：配管の裏に古い熱電対の線">
  <label class="f" for="uf">どうなりそう？（任意）</label><input type="text" id="uf" value="${esc(u.fear)}">
  <label class="f" for="um">対策</label><input type="text" id="um" value="${esc(u.measure)}">
  <div class="row2">${k>=0?`<button class="btn none" id="uDel">削除</button>`:`<button class="btn none" id="uCan">やめる</button>`}<button class="btn ok" id="uOk">追加</button></div>`);
  const ok=()=>$("#uOk").disabled=!($("#un").value.trim()&&$("#um").value.trim());
  ["#un","#um"].forEach(s=>$(s).oninput=ok);ok();
  if(k>=0)$("#uDel").onclick=()=>{S.custom.splice(k,1);closeSheet();vHub()};else $("#uCan").onclick=closeSheet;
  $("#uOk").onclick=()=>{const v={name:$("#un").value.trim(),fear:$("#uf").value.trim(),measure:$("#um").value.trim()};if(k>=0)S.custom[k]=v;else S.custom.push(v);closeSheet();vHub()};
}

/* ---------- 締め ---------- */
function vClose(){
  const done=chipList().filter(x=>x.state==="done");
  const cands=done.map(x=>({key:x.id,name:x.name,fear:x.fear,sub:x.sel.join("、")||x.note})).concat(S.custom.map((u,k)=>({key:"U"+k,name:u.name,fear:u.fear||u.name,sub:u.measure})));
  $("#main").innerHTML=`
  <h2>一番ヤバいのはどれ？</h2>
  <p class="lead">対策したものの中から1つ選んで、最悪どうなるかを一言で。</p>
  ${cands.map(x=>`<button class="pick ${S.worst===x.key?"sel":""}" data-k="${x.key}"><b>${esc(x.name)}</b><small>対策：${esc(x.sub)}</small></button>`).join("")||`<p class="hint">対策したチップがありません。</p>`}
  <label class="f" for="wt">最悪ケース</label><textarea id="wt" placeholder="選ぶと候補が入ります。現場に合わせて書き直してください">${esc(S.worstText)}</textarea>`;
  document.querySelectorAll(".pick").forEach(b=>b.onclick=()=>{const x=cands.find(c=>c.key===b.dataset.k);S.worstText=$("#wt").value;S.worst=x.key;if(!S.worstText.trim()||S.worstText===S.worstAuto){S.worstText=x.fear;S.worstAuto=x.fear}vClose()});
  const upd=()=>{S.worstText=$("#wt").value;$("#nx").disabled=!(S.worst&&S.worstText.trim())};
  bar(`<button class="btn ghost" id="bk">戻る</button><button class="btn main" id="nx">次へ</button>`);
  $("#wt").oninput=upd;upd();
  $("#bk").onclick=()=>go("hub");$("#nx").onclick=()=>go("enough");
}
function vEnough(){
  $("#main").innerHTML=`
  <div class="big-q">KYは、十分？？</div>
  <div class="opts" style="justify-content:center">
    <button class="opt ${S.enough==="yes"?"sel":""}" data-v="yes">十分</button>
    <button class="opt ${S.enough==="no"?"sel":""}" data-v="no">まだ気になる</button></div>
  <label class="f" for="cm">ひとことコメント（必須）</label>
  <textarea id="cm" placeholder="気になっていること、念のためやること、なんでも1つ">${esc(S.comment)}</textarea>
  ${S.enough==="no"?`<p class="hint">気になるところがあれば、見回りに戻って想定外を追加できます。</p><button class="btn ghost" id="toHub" style="width:100%">見回りに戻る</button>`:""}`;
  document.querySelectorAll(".opts .opt").forEach(b=>b.onclick=()=>{S.comment=$("#cm").value;S.enough=b.dataset.v;vEnough()});
  if($("#toHub"))$("#toHub").onclick=()=>{S.comment=$("#cm").value;go("hub")};
  const upd=()=>{S.comment=$("#cm").value;$("#nx").disabled=!(S.enough&&S.comment.trim())};
  bar(`<button class="btn ghost" id="bk">戻る</button><button class="btn main" id="nx">職制判断へ</button>`);
  $("#cm").oninput=upd;upd();
  $("#bk").onclick=()=>go("close");$("#nx").onclick=()=>go("judge");
}
const RES=["実施可","条件付き可","再検討","中止"];
function vJudge(){
  const st=gateState();const j=S.judge;const c=counts();
  const noList=gateItems().filter(g=>S.gate[g.id]&&S.gate[g.id].ans==="no");
  $("#main").innerHTML=`
  <h2>職制判断</h2>
  <p class="lead">作業者から内容を聞いて判断してください。</p>
  ${st.anyNo?`<div class="must"><b>確認でできないものがあります</b><br>${noList.map(g=>`・${esc(g.q)} → ${esc(S.gate[g.id].alts.join("、"))}`).join("<br>")}</div>`:""}
  ${S.enough==="no"?`<div class="must">作業者は「まだ気になる」と回答しています</div>`:""}
  <div class="rec"><dl>
    <dt>作業</dt><dd>${esc(S.W)}　${esc(S.task)}</dd>
    <dt>一番ヤバいところ</dt><dd>${esc(S.worstText)}</dd>
    <dt>作業者コメント</dt><dd>${esc(S.comment)}</dd>
    <dt>見回り</dt><dd>対策済 ${c.done}／該当なし ${c.none}${(()=>{const b=chipList().filter(x=>x.state==="none"&&x.bulk);return b.length?`（うち まとめて該当なし ${b.length}：${b.map(x=>esc(x.name)).join("、")}）`:""})()}${S.custom.length?`（想定外の追加 ${S.custom.length}）`:""}</dd>
  </dl></div>
  <label class="f" for="jn">判断者</label><input type="text" id="jn" value="${esc(j.name)}" placeholder="名前（電話で承認した場合もここに）">
  <div class="grp"><div class="gl">判断</div><div class="opts judge">${RES.map((r,k)=>`<button class="opt r${k} ${j.result===r?"sel":""}" data-v="${r}">${r}</button>`).join("")}</div></div>
  <label class="f" for="jr">判断の理由（必須）</label><textarea id="jr" placeholder="なぜその判断にしたか">${esc(j.reason)}</textarea>`;
  document.querySelectorAll(".judge .opt").forEach(b=>b.onclick=()=>{j.name=$("#jn").value;j.reason=$("#jr").value;j.result=b.dataset.v;vJudge()});
  const upd=()=>{j.name=$("#jn").value;j.reason=$("#jr").value;$("#nx").disabled=!(j.name.trim()&&j.result&&j.reason.trim())};
  bar(`<button class="btn ghost" id="bk">戻る</button><button class="btn main" id="nx">記録する</button>`);
  ["#jn","#jr"].forEach(s=>$(s).oninput=upd);upd();
  $("#bk").onclick=()=>go("enough");
  $("#nx").onclick=()=>{S.t1=Date.now();saveRecord();go("record")};
}
function recordObj(){
  const ch=chipList();
  return{id:"r"+S.t0,date:new Date(S.t0).toLocaleString("ja-JP",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}),
    secs:Math.round((S.t1-S.t0)/1000),worker:S.worker.trim(),equip:S.equip.trim(),task:S.task.trim(),
    work:S.W,targets:[...S.T],conds:[...S.K],
    gateNo:gateItems().filter(g=>S.gate[g.id]&&S.gate[g.id].ans==="no").map(g=>({q:g.q,reason:S.gate[g.id].reason,alts:S.gate[g.id].alts})),
    done:ch.filter(x=>x.state==="done").map(x=>({id:x.id,name:x.name,measures:x.sel,note:x.note})),
    none:ch.filter(x=>x.state==="none").map(x=>({id:x.id,name:x.name,reason:x.noneReason||"",bulk:!!x.bulk})),
    custom:S.custom,worst:S.worstText,enough:S.enough,comment:S.comment,judge:Object.assign({},S.judge),after:null};
}
function saveRecord(){const h=loadH();const r=recordObj();h.push(r);saveH(h.slice(-200));S.recId=r.id}
function vRecord(){
  const r=loadH().find(x=>x.id===S.recId)||recordObj();
  $("#main").innerHTML=`
  <h2>記録しました</h2>
  <p class="lead">所要時間 ${fmt(r.secs*1000)}</p>
  <div class="rec"><dl>
    <dt>誰が</dt><dd>${esc(r.worker)}</dd>
    <dt>何の作業で</dt><dd>${esc(r.equip)}　${esc(r.work)}　${esc(r.task)}</dd>
    <dt>何を危険と考え</dt><dd>${esc(r.worst)}</dd>
    <dt>何を対策とし</dt><dd>${r.done.map(d=>`${esc(d.name)}：${esc([...d.measures,d.note].filter(Boolean).join("、"))}`).join("<br>")}${r.custom.map(u=>`<br>【想定外】${esc(u.name)}：${esc(u.measure)}`).join("")}</dd>
    ${r.gateNo.length?`<dt>確認でできなかったこと</dt><dd>${r.gateNo.map(g=>`${esc(g.q)}（${esc(g.reason)}）→ ${esc(g.alts.join("、"))}`).join("<br>")}</dd>`:""}
    <dt>作業者コメント</dt><dd>${esc(r.comment)}</dd>
    <dt>誰が判断したか</dt><dd>${esc(r.judge.name)}：<b>${esc(r.judge.result)}</b>　${esc(r.judge.reason)}</dd>
  </dl></div>
  <p class="hint">作業が終わったら、トップの記録一覧から「作業後の振り返り」を入れてください。想定外は次にこの設備を選んだ人に表示されます。</p>`;
  bar(`<button class="btn ghost" id="cp">テキストでコピー</button><button class="btn main" id="nw">トップへ</button>`);
  $("#cp").onclick=()=>{const t=`【KY記録】${r.date}\n作業者：${r.worker}\n設備：${r.equip}\n作業：${r.work}／${r.task}\n最悪ケース：${r.worst}\n対策：\n${r.done.map(d=>"・"+d.name+"："+[...d.measures,d.note].filter(Boolean).join("、")).join("\n")}${r.custom.map(u=>"\n・【想定外】"+u.name+"："+u.measure).join("")}\nコメント：${r.comment}\n判断：${r.judge.name} ${r.judge.result}（${r.judge.reason}）\n所要：${fmt(r.secs*1000)}`;
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast("コピーしました")).catch(()=>toast("コピーできませんでした"))};
  $("#nw").onclick=()=>{S=fresh();go("start")};
}
function afterSheet(id){
  let had=null;
  const draw=()=>{openSheet(`<h3>作業後の振り返り</h3><p class="hint">やってみて、想定してなかった危ないことはあった？</p>
    <div class="opts" style="margin-top:10px"><button class="opt ${had===true?"sel":""}" data-v="1">あった</button><button class="opt ${had===false?"sel":""}" data-v="0">なかった</button></div>
    ${had?`<label class="f" for="at">何があった？</label><textarea id="at" placeholder="次にこの設備を触る人に伝わるように"></textarea>`:""}
    <div class="row2"><button class="btn none" id="aC">やめる</button><button class="btn ok" id="aOk" ${had===null?"disabled":""}>保存</button></div>`);
    $("#sheetIn").querySelectorAll(".opts .opt").forEach(b=>b.onclick=()=>{had=b.dataset.v==="1";draw()});
    $("#aC").onclick=closeSheet;
    $("#aOk").onclick=()=>{const t=had?$("#at").value.trim():"";if(had&&!t){toast("内容を書いてください");return}
      const h=loadH();const r=h.find(x=>x.id===id);if(r){r.after={had,text:t};saveH(h)}closeSheet();toast("保存しました");vStart()};
  };draw();
}
render();
</script>
</body>
</html>
