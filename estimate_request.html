<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- build: 1.3 | 20260528 | 見積依頼ツール | uk |-->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>見積依頼ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#0c1117; --surface:#161b22; --surface2:#1c2230;
      --input-bg:#263148; --border:#2a3444;
      --ink:#cdd9e5; --muted:#768390;
      --accent:#388bfd; --good:#3fb950; --warn:#d29922; --bad:#f85149; --orange:#f97316;
    }
    /* ライトモード */
    html[data-theme="light"] {
      --bg:#f0f2f5; --surface:#ffffff; --surface2:#f5f6f8;
      --input-bg:#eef1f7; --border:#d0d7e3;
      --ink:#1a1f2e; --muted:#7a8499;
      --accent:#1a6ef5; --good:#1a9e3f; --warn:#b07d00; --bad:#d63030; --orange:#d95e00;
    }

    /* テーマトグルボタン */
    .theme-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--muted);
      font-size: 13px;
      padding: 3px 10px;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.4;
    }
    .theme-btn:hover { border-color: var(--accent); color: var(--accent); }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans JP',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;font-size:14px;-webkit-text-size-adjust:100%}
    .home-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:4px 16px;display:flex;align-items:center}
    .home-bar a{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-decoration:none;transition:color .2s}
    .home-bar a:hover{color:var(--accent)}
    header{border-bottom:1px solid var(--border);padding:8px 14px;display:flex;align-items:center;gap:8px;background:var(--surface);flex-shrink:0;flex-wrap:nowrap;overflow:hidden;min-height:44px}
    header h1{font-size:13px;font-weight:700;letter-spacing:.02em;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
    .badge{font-size:10px;font-weight:600;padding:2px 6px;border-radius:999px;border:1px solid;white-space:nowrap;flex-shrink:0}
    .badge-orange{border-color:var(--orange);color:var(--orange)}
    #verBadge{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:2px 6px;white-space:nowrap;margin-left:auto;flex-shrink:0}
    @media(max-width:480px){header{padding:6px 10px;gap:6px}header h1{font-size:12px}#verBadge{display:none}}
    .app{display:flex;flex:1;overflow:hidden}
    /* 左 */
    .left-panel{width:220px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
    .left-meta-wrap{padding:0 10px 12px;display:flex;flex-direction:column;gap:7px}
    .mail-meta-section{flex:1;display:flex;flex-direction:column}
    .panel-section{padding:12px 0 4px;border-bottom:1px solid var(--border)}
    .panel-section:last-child{border-bottom:none;flex:1}
    .panel-label{font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--muted);padding:0 14px 6px;text-transform:uppercase;font-family:'JetBrains Mono',monospace}
    .company-item{padding:8px 14px;cursor:pointer;font-size:12px;border-left:3px solid transparent;transition:all .15s;color:var(--muted)}
    .company-item:hover{background:var(--surface2);color:var(--ink)}
    .company-item.active{background:var(--surface2);border-left-color:var(--orange);color:var(--orange);font-weight:600}
    .cat-item{padding:7px 14px;cursor:pointer;font-size:12px;border-left:3px solid transparent;transition:all .15s;color:var(--muted);display:flex;align-items:center;gap:6px}
    .cat-item:hover{background:var(--surface2);color:var(--ink)}
    .cat-item.active{background:rgba(56,139,253,.07);border-left-color:var(--accent);color:var(--accent);font-weight:600}
    .cat-count{margin-left:auto;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);background:var(--surface2);border-radius:3px;padding:1px 4px}
    .search-wrap{padding:8px 10px}
    .search-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:11px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;outline:none;transition:border-color .15s}
    .search-input:focus{border-color:var(--accent)}
    .search-input::placeholder{color:var(--muted)}
    /* 中 */
    .main{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:18px}
    .section-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .section-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
    .section-line{flex:1;height:1px;background:var(--border)}
    .item-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted)}
    .items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
    .item-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 14px;cursor:pointer;transition:all .15s;position:relative}
    .item-card:hover{background:var(--surface2);border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 14px rgba(56,139,253,.08)}
    .item-card.in-cart{border-color:var(--good);background:rgba(63,185,80,.04)}
    .item-no{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);margin-bottom:4px}
    .item-spec{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:2px}
    .item-teishaku{font-size:10px;color:var(--muted);margin-bottom:8px}
    .item-meta{display:flex;justify-content:space-between;align-items:center}
    .item-unit{color:var(--muted);font-size:10px}
    .cart-badge-card{position:absolute;top:8px;right:8px;background:var(--good);color:white;font-size:9px;font-weight:700;padding:1px 5px;border-radius:3px;font-family:'JetBrains Mono',monospace}
    .no-results{color:var(--muted);font-size:12px;text-align:center;padding:40px 0}
    /* 右: カート */
    .cart-panel{width:360px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
    .cart-head{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .cart-head-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;flex:1}
    .cart-count-badge{background:var(--orange);color:white;font-size:10px;font-weight:700;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace}
    .generate-btn-top{background:none;border:1px solid var(--border);border-radius:4px;color:var(--muted);padding:3px 8px;font-size:10px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s;white-space:nowrap}
    .generate-btn-top:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
    .generate-btn-top:disabled{opacity:.35;cursor:not-allowed}
    .cart-items{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
    .cart-empty{color:var(--muted);font-size:12px;text-align:center;padding:40px 0}
    .cart-item{background:var(--surface2);border-radius:6px;padding:10px 12px;border:1px solid var(--border)}
    .cart-item-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
    .cart-item-spec{font-size:12px;font-weight:700;color:var(--ink);flex:1;line-height:1.4}
    .cart-item-teishaku{font-size:10px;color:var(--muted)}
    .cart-item-remove{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:0;line-height:1;flex-shrink:0;transition:color .1s}
    .cart-item-remove:hover{color:var(--bad)}
    .cart-item-controls{display:flex;align-items:center;gap:8px;margin-bottom:8px}
    .qty-ctrl{display:flex;align-items:center;gap:2px;background:var(--bg);border-radius:4px;padding:2px 4px;border:1px solid var(--border)}
    .qty-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;border-radius:3px;transition:all .1s}
    .qty-btn:hover{background:var(--border);color:var(--ink)}
    .qty-value{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;min-width:22px;text-align:center;color:var(--ink)}
    .qty-unit{font-size:10px;color:var(--muted)}
    /* トグル行 */
    .toggle-row{display:flex;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:6px;font-size:11px}
    .toggle-row input[type="radio"]{display:none}
    .toggle-row label{flex:1;text-align:center;padding:4px 6px;cursor:pointer;color:var(--muted);background:var(--surface2);transition:all .15s;user-select:none;font-size:11px;border-right:1px solid var(--border)}
    .toggle-row label:last-child{border-right:none}
    .toggle-row input[type="radio"]:checked+label{background:var(--input-bg);color:var(--ink);font-weight:600}
    /* チェック行 */
    .check-row{display:flex;align-items:center;gap:6px;margin-bottom:6px;padding:4px 7px;background:var(--surface2);border:1px solid var(--border);border-radius:4px;font-size:11px;color:var(--muted);cursor:pointer}
    .check-row input[type="checkbox"]{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;flex-shrink:0}
    .check-row.checked{background:rgba(56,139,253,.08);border-color:var(--accent);color:var(--accent)}
    /* 寸法行 */
    .dim-row{display:flex;align-items:center;gap:0;border:1px solid var(--border);border-radius:4px;overflow:hidden;margin-bottom:6px;font-size:11px}
    .dim-label{background:var(--surface2);color:var(--muted);white-space:nowrap;font-size:10px;padding:4px 7px;border-right:1px solid var(--border);flex-shrink:0}
    .dim-unit-label{background:var(--surface2);color:var(--muted);font-size:10px;white-space:nowrap;flex-shrink:0;padding:4px 6px;border-left:1px solid var(--border)}
    .dim-sep{color:var(--muted);font-size:12px;flex-shrink:0;padding:0 3px;background:var(--input-bg)}
    .dim-half{width:64px!important}
    .dim-input{background:var(--input-bg);border:none;width:100%;color:var(--ink);font-size:11px;font-family:'JetBrains Mono',monospace;outline:none;padding:4px 5px}
    .dim-row.error{border-color:var(--bad)!important}
    .dim-row.error .dim-label{background:rgba(248,81,73,.15);color:var(--bad)}
    .dim-row.error .dim-input{color:var(--bad)}
    .dim-error-msg{display:none;font-size:10px;color:var(--bad);padding:2px 4px 4px;font-family:'JetBrains Mono',monospace}
    .dim-error-msg.show{display:block}
    .note-input{width:100%;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:11px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;resize:none;outline:none;transition:border-color .15s}
    .note-input::placeholder{color:var(--muted)}
    .note-input:focus{border-color:var(--accent)}
    /* フッター */
    .export-btn{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--muted);padding:6px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .15s;width:100%;text-align:left}
    .export-btn:hover{border-color:var(--good);color:var(--good)}
    .meta-row{display:flex;align-items:center;gap:8px;font-size:12px}
    .meta-label{color:var(--muted);width:66px;flex-shrink:0;font-size:10px}
    .meta-input{flex:1;background:var(--input-bg);border:1px solid var(--border);border-radius:4px;padding:5px 7px;font-size:12px;color:var(--ink);font-family:'Noto Sans JP',sans-serif;outline:none;transition:border-color .15s}
    .meta-input:focus{border-color:var(--accent)}
    .generate-btn{background:var(--accent);color:white;border:none;border-radius:6px;padding:10px;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans JP',sans-serif;letter-spacing:.04em;transition:all .15s;width:100%}
    .generate-btn:hover{background:#2d7df0}
    .generate-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    /* メールパネル */
    .mail-panel{position:fixed;bottom:0;left:0;right:0;height:420px;background:var(--surface);border-top:2px solid var(--accent);display:none;flex-direction:column;overflow:hidden;z-index:200;box-shadow:0 -8px 32px rgba(0,0,0,.5)}
    .mail-panel.visible{display:flex}
    .mail-head{padding:10px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
    .mail-head-title{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;flex:1}
    .copy-btn{background:var(--surface2);border:1px solid var(--border);border-radius:5px;color:var(--ink);padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'Noto Sans JP',sans-serif;transition:all .15s}
    .copy-btn:hover,.copy-btn.copied{background:var(--good);border-color:var(--good);color:white}
    .close-btn{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0;line-height:1;transition:color .1s}
    .close-btn:hover{color:var(--bad)}
    .mail-body{flex:1;overflow-y:auto;padding:10px 16px}
    .mail-textarea{width:100%;min-height:280px;height:100%;background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-size:11px;line-height:1.8;color:var(--ink);font-family:'JetBrains Mono',monospace;resize:none;outline:none}
    .mail-textarea:focus{border-color:var(--accent)}

    /* ══════ スマホ用 (≤768px) ══════ */
    @media(max-width:768px){
      /* アプリ全体: タブ式シングルカラム */
      body{overflow:hidden;height:100vh}
      .app{flex-direction:column;overflow:hidden;
        height:calc(100vh - 44px - 33px);  /* ヘッダー・homebar分を引く */
        position:relative}

      /* 左パネルごと非表示（mail-meta-sectionも含め全部隠す） */
      .left-panel{display:none!important}

      /* カートパネルをabsoluteで重ねてタブ切替 */
      .cart-panel{
        position:absolute;top:0;left:0;right:0;bottom:0;
        width:100%;border-left:none;border-top:none;
        display:flex;flex-direction:column;
        overflow:hidden;
        opacity:0;pointer-events:none;
        transition:opacity .15s;
      }
      .cart-panel.sp-active{opacity:1;pointer-events:auto;}
      /* スマホ専用の依頼情報フッター */
      .sp-meta-footer{display:flex;flex-direction:column;gap:7px;
        padding:10px 12px;border-top:2px solid var(--border);
        background:var(--surface);flex-shrink:0;}
      .cart-items{flex:1;overflow-y:auto;}

      /* 商品メイン・カートパネルをabsoluteで重ねてタブ切替 */
      .main{
        position:absolute;top:0;left:0;right:0;bottom:0;
        padding:10px 12px;
        overflow-y:auto;
        display:flex;
        opacity:0;pointer-events:none;
        transition:opacity .15s;
      }
      .main.sp-active{opacity:1;pointer-events:auto;}

      /* アイテムグリッドを2列に */
      .items-grid{grid-template-columns:repeat(2,1fr);gap:6px}
      .item-card{padding:10px 10px}
      .item-spec{font-size:12px}

      /* ── スマホタブバー ── */
      .sp-tabs{
        display:flex;
        background:var(--surface);
        border-bottom:1px solid var(--border);
        flex-shrink:0;
        position:sticky;top:0;z-index:90;
        box-shadow:0 2px 8px rgba(0,0,0,.2);
      }
      .sp-tab{
        flex:1;padding:10px 0;text-align:center;
        font-size:12px;font-weight:600;color:var(--muted);
        cursor:pointer;border-bottom:2px solid transparent;
        transition:all .15s;position:relative;
        background:var(--surface);
      }
      .sp-tab.active{color:var(--accent);border-bottom-color:var(--accent)}
      .sp-tab-badge{
        position:absolute;top:6px;right:calc(50% - 22px);
        background:var(--orange);color:white;
        font-size:9px;font-weight:700;
        width:16px;height:16px;border-radius:50%;
        display:none;align-items:center;justify-content:center;
        font-family:'JetBrains Mono',monospace;
      }
      .sp-tab-badge.show{display:flex}

      /* ── スマホ大分類チップ ── */
      .sp-cat-bar{
        display:flex;gap:6px;
        overflow-x:auto;padding:8px 12px;
        background:var(--surface);
        border-bottom:1px solid var(--border);
        flex-shrink:0;
        -webkit-overflow-scrolling:touch;
        scrollbar-width:none;
      }
      .sp-cat-bar::-webkit-scrollbar{display:none}
      .sp-chip{
        flex-shrink:0;
        padding:4px 10px;border-radius:20px;
        font-size:11px;font-weight:600;
        border:1px solid var(--border);
        color:var(--muted);background:var(--surface2);
        cursor:pointer;white-space:nowrap;transition:all .15s;
      }
      .sp-chip.active{background:rgba(56,139,253,.12);border-color:var(--accent);color:var(--accent)}

      /* ── スマホ発注先セレクト ── */
      .sp-supplier-bar{
        display:flex;align-items:center;gap:8px;
        padding:8px 12px;
        background:var(--surface);
        border-bottom:1px solid var(--border);
        flex-shrink:0;
      }
      .sp-supplier-label{font-size:10px;color:var(--muted);white-space:nowrap}
      .sp-supplier-select{
        flex:1;background:var(--input-bg);border:1px solid var(--border);
        border-radius:5px;padding:5px 8px;font-size:12px;color:var(--ink);
        font-family:'Noto Sans JP',sans-serif;outline:none;
      }
      .sp-search{
        flex-shrink:0;width:36px;height:32px;
        background:var(--surface2);border:1px solid var(--border);
        border-radius:5px;display:flex;align-items:center;justify-content:center;
        cursor:pointer;font-size:14px;
      }

      /* ── スマホ検索バー（展開式）── */
      .sp-search-bar{
        display:none;padding:6px 12px;
        background:var(--surface);border-bottom:1px solid var(--border);
      }
      .sp-search-bar.open{display:block}
      .sp-search-input{
        width:100%;background:var(--input-bg);border:1px solid var(--border);
        border-radius:5px;padding:7px 10px;font-size:12px;color:var(--ink);
        font-family:'Noto Sans JP',sans-serif;outline:none;
      }
      .sp-search-input:focus{border-color:var(--accent)}
      .sp-search-input::placeholder{color:var(--muted)}

      /* メールパネルの高さをスマホ向けに */
      .mail-panel{height:85vh}
    }

    /* PC: スマホ専用要素を非表示 */
    @media(min-width:769px){
      .sp-tabs{display:none}
      .sp-cat-bar{display:none}
      .sp-supplier-bar{display:none}
      .sp-search-bar{display:none}
      .sp-meta-footer{display:none!important}
      /* PCでは.main/.cart-panelは常に表示 */
      .main{display:flex!important}
      .cart-panel{display:flex!important}
    }

    ::-webkit-scrollbar{width:4px;height:4px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
  </style>
</head>
<body>
  <div class="home-bar">
    <a href="index.html" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--muted)'">← HOME</a>
  </div>
  <header>
    <h1>🗒️ 見積依頼ツール</h1>
    <span class="badge badge-orange">Beta</span>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙 ダーク</button>
    <span id="verBadge">ver.--</span>
  </header>

  <!-- ── スマホ専用UI ── -->
  <div class="sp-supplier-bar" id="spSupplierBar" style="display:none">
    <span class="sp-supplier-label">発注先</span>
    <select class="sp-supplier-select" id="spSupplierSelect" onchange="spSelectSupplier(this.value)"></select>
    <div class="sp-search" onclick="toggleSpSearch()" title="検索">🔍</div>
  </div>
  <div class="sp-search-bar" id="spSearchBar">
    <input class="sp-search-input" id="spSearchInput" type="text" placeholder="寸法・品番を検索…" oninput="spFilterItems()">
  </div>
  <div class="sp-cat-bar" id="spCatBar" style="display:none"></div>
  <div class="sp-tabs" id="spTabs" style="display:none">
    <div class="sp-tab active" id="spTabItems" onclick="spSwitchTab('items')">
      📦 商品リスト
    </div>
    <div class="sp-tab" id="spTabCart" onclick="spSwitchTab('cart')">
      🛒 カート
      <span class="sp-tab-badge" id="spTabBadge">0</span>
    </div>
  </div>

  <div class="app">
    <div class="left-panel">
      <div class="panel-section">
        <div class="panel-label">発注先</div>
        <div id="companyList"></div>
      </div>

    // ══════ ソート（specフィールドから数値抽出）══════
    function specNums(spec) {
      var nums = [];
      var re = /[\d]+\.?[\d]*/g, m;
      while ((m = re.exec(spec)) !== null) nums.push(parseFloat(m[0]));
      return nums;
    }
    function sortItems(items) {
      return items.slice().sort(function(a,b){
        var ka = specNums(a.spec), kb = specNums(b.spec);
        // pipeはSGP黒→白の順を保持するためspec文字列も考慮
        if (a.cat==='pipe') {
          var aw = a.spec.includes('白')?0:1, bw = b.spec.includes('白')?0:1;
          if (aw!==bw) return aw-bw;
        }
        for (var i=0;i<Math.max(ka.length,kb.length);i++){
          var va=ka[i]!==undefined?ka[i]:0, vb=kb[i]!==undefined?kb[i]:0;
          if (va!==vb) return va-vb;
        }
        return 0;
      });
    }

    // ══════ 商品一覧 ══════
    function renderItems(){
      var main=document.getElementById('itemsMain');
      var items=RAW_DATA.filter(function(d){
        if(d.supplier && d.supplier!==selectedSupplier) return false;
        if(selectedCat!=='all'&&d.cat!==selectedCat) return false;
        if(searchQuery&&d.spec.indexOf(searchQuery)<0&&d.no.indexOf(searchQuery)<0&&d.teishaku.indexOf(searchQuery)<0) return false;
        return true;
      });
      if(!items.length){ main.innerHTML='<div class="no-results">該当する品目がありません</div>'; return; }

      var grouped={};
      items.forEach(function(d){ if(!grouped[d.cat]) grouped[d.cat]=[]; grouped[d.cat].push(d); });
      var order=selectedCat==='all'?CAT_ORDER:[selectedCat];
      var html='';
      order.forEach(function(catKey){
        if(!grouped[catKey]) return;
        var catItems=sortItems(grouped[catKey]);
        var catInfo=CATEGORIES.find(function(c){ return c.key===catKey; })||{label:catKey,icon:'📦'};
        html+='<div><div class="section-header">';
        html+='<span class="section-title">'+catInfo.icon+' '+catInfo.label+'</span>';
        html+='<div class="section-line"></div>';
        html+='<span class="item-count">'+catItems.length+'品目</span></div>';
        html+='<div class="items-grid">';
        catItems.forEach(function(d){
          var key=itemKey(d);

          if(d.no) html+='<div class="item-no">'+d.no+'</div>';

    // ══════ カート操作 ══════
    function addToCart(key){
      var d=RAW_DATA.find(function(r){ return itemKey(r)===key; });
      if(!d) return;
      if(!cart[key]){
        cart[key]={
          item:d, qty:1, note:'',
          specMode:'standard', cutLength:'', cutWidth:'',
          paintMode:'none', stainless:false,
          surface:'kuro', material:'S45C', materialOther:'',
        };
      } else { cart[key].qty++; }
      renderCart(); renderItems(); updateBtn();
    }
    function removeFromCart(key){ delete cart[key]; renderCart(); renderItems(); updateBtn(); }
    function changeQty(key,delta){
      if(!cart[key]) return;
      cart[key].qty=Math.max(1,cart[key].qty+delta);
      renderCart(); renderItems();
    }
    function updateNote(key,val){        if(cart[key]) cart[key].note=val; }

    // ── 寸法バリデーション ──
    // 入力欄のdim-rowにerrorクラス、下のdim-error-msgにメッセージを表示
    function validateDim(inputEl, val, maxVal, label) {
      var row = inputEl.closest('.dim-row');
      var errEl = row ? row.nextElementSibling : null;
      if (!row) return true;
      var num = parseFloat(val);
      if (!val || isNaN(num)) {
        // 未入力はエラーなし
        row.classList.remove('error');
        if (errEl && errEl.classList.contains('dim-error-msg')) errEl.classList.remove('show');
        return true;
      }
      if (num <= 0) {
        row.classList.add('error');
        if (errEl && errEl.classList.contains('dim-error-msg')) {
          errEl.textContent = '⚠ 0より大きい値を入力してください';
          errEl.classList.add('show');
        }
        return false;
      }
      if (maxVal > 0 && num > maxVal) {
        row.classList.add('error');
        if (errEl && errEl.classList.contains('dim-error-msg')) {
          errEl.textContent = '⚠ 定尺 ' + maxVal + 'mm を超えています（入力値: ' + num + 'mm）';
          errEl.classList.add('show');
        }
        return false;
      }
      row.classList.remove('error');
      if (errEl && errEl.classList.contains('dim-error-msg')) errEl.classList.remove('show');
      return true;
    }

    function updateCutLength(key, val, inputEl) {
      if (!cart[key]) return;
      cart[key].cutLength = val;
      if (!inputEl) return;
      var d = cart[key].item;
      // 最大値: 鋼板=短辺(w)、棒系=定尺長さ
      var maxVal = (d.cat === 'plate') ? d.w : parseInt(d.teishaku) || 0;
      validateDim(inputEl, val, maxVal, d.cat === 'plate' ? '縦（短辺）' : '切断長さ');
    }

    function updateCutWidth(key, val, inputEl) {
      if (!cart[key]) return;
      cart[key].cutWidth = val;
      if (!inputEl) return;
      var d = cart[key].item;
      // 鋼板のみ: 長辺(h)
      var maxVal = d.h || 0;
      validateDim(inputEl, val, maxVal, '横（長辺）');
    }
    function updateSpecMode(key,val){    if(!cart[key]) return; cart[key].specMode=val; renderCart(); }
    function updatePaintMode(key,val){   if(!cart[key]) return; cart[key].paintMode=val; renderCart(); }
    function updateStainless(key,el){    if(!cart[key]) return; cart[key].stainless=el.checked; el.closest('.check-row').classList.toggle('checked',el.checked); }
    function updateSurface(key,val){     if(cart[key]) cart[key].surface=val; }
    function updateMaterial(key,val){    if(!cart[key]) return; cart[key].material=val; renderCart(); }
    function updateMaterialOther(key,val){ if(cart[key]) cart[key].materialOther=val; }

    function radioBtn(name,value,label,checked,onchange){
      var id=name+'-'+value.replace(/[^a-zA-Z0-9]/g,'_');
      return '<input type="radio" id="'+id+'" name="'+name+'" value="'+value+'"'+(checked?' checked':'')+' onchange="'+onchange+'">'
            +'<label for="'+id+'">'+label+'</label>';
    }

          html+='</div>';

          html+=radioBtn('mat-'+uid,'S45C','S45C',c.material==='S45C','updateMaterial(\''+key+'\',this.value)');
          html+=radioBtn('mat-'+uid,'SS400','SS400',c.material==='SS400','updateMaterial(\''+key+'\',this.value)');
          html+=radioBtn('mat-'+uid,'other','その他',c.material==='other','updateMaterial(\''+key+'\',this.value)');

          html+='</div>';

              html+='<div class="dim-row"><span class="dim-label">縦（短辺）</span>';

              html+='<div class="dim-error-msg"></div>';
              html+='<div class="dim-row"><span class="dim-label">横（長辺）</span>';
              html+='<input class="dim-input" type="text" placeholder="例）900" value="'+(c.cutWidth||'')+'"';
              html+=' oninput="updateCutWidth(\''+key+'\',this.value,this)">';
              html+='<span class="dim-unit-label">mm</span></div>';
              html+='<div class="dim-error-msg"></div>';
            } else {
              html+='<div class="dim-row"><span class="dim-label">切断長さ</span>';
              html+='<input class="dim-input" type="text" placeholder="例）500" value="'+(c.cutLength||'')+'"';
              html+=' oninput="updateCutLength(\''+key+'\',this.value,this)">';
              html+='<span class="dim-unit-label">mm</span></div>';
              html+='<div class="dim-error-msg"></div>';
            }
          }
          if(PAINT_CATS.indexOf(d.cat)>=0){
            html+='<div class="toggle-row">';

            html+=radioBtn('paint-'+uid,'color','カラー（錆止め）',c.paintMode==='color','updatePaintMode(\''+key+'\',this.value)');

          }

        // 備考
        html+='<textarea class="note-input" rows="2" placeholder="品目備考（用途・仕様補足など）"';
        html+=' oninput="updateNote(\''+key+'\',this.value)">'+(c.note||'')+'</textarea>';
        html+='</div>';
      });
      container.innerHTML=html;

    // ══════ メール生成 ══════
    function generateMail(){
      var keys=Object.keys(cart);
      if(!keys.length) return;
      var isSp = isMobile();
      var requester=(isSp
        ? document.getElementById('spRequesterName').value
        : document.getElementById('requesterName').value) || '（依頼者名未入力）';
      var deliveryRaw = isSp
        ? document.getElementById('spDeliveryDate').value
        : document.getElementById('deliveryDate').value;
      var delivery=deliveryRaw?new Date(deliveryRaw).toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'}):'（希望納期未入力）';
      var globalNote = isSp ? document.getElementById('spGlobalNote').value : document.getElementById('globalNote').value;
      var bySupplier={};
      keys.forEach(function(key){
        var c=cart[key], s=c.item.supplier||'（発注先未設定）';
        if(!bySupplier[s]) bySupplier[s]=[];
        bySupplier[s].push(c);
      });
      var today=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});
      var mailText='';

      Object.keys(bySupplier).forEach(function(supplier){
        var entries=bySupplier[supplier];
        var itemLines='';
        entries.forEach(function(c,i){
          var d=c.item;
          var line='';

          if(d.cat==='round'){
            // 丸棒: 材質・黒皮ミガキ・Φ・長さをまとめて品名に
            var mat=c.material==='other'?(c.materialOther||'材質不明'):c.material;
            var surf=c.surface==='kuro'?'黒皮':'ミガキ';
            line='丸棒　'+d.spec+'　'+mat+'　'+surf;
            if(c.cutLength) line+='　切断長さ '+c.cutLength+'mm';
          } else {
            // specだけ（定尺サイズは含まない）+ カテゴリ名
            var catInfo=CATEGORIES.find(function(cat){ return cat.key===d.cat; });
            var catLabel=catInfo?catInfo.label:d.cat;
            line=catLabel+'　'+d.spec;
            if(c.specMode==='cut'){
              if(d.cat==='plate') line+='\n　　切断寸法：'+(c.cutLength||'?')+'mm × '+(c.cutWidth||'?')+'mm';
              else if(c.cutLength) line+='\n　　切断長さ：'+c.cutLength+'mm';
            } else {
              line+='\n　　指定：定尺（'+d.teishaku+(d.cat==='plate'?'':' mm')+')';
            }
            if(PAINT_CATS.indexOf(d.cat)>=0){
              line+='\n　　塗装：'+(c.paintMode==='color'?'カラー（錆止め）':'塗装無');
            }
          }

          if(c.stainless) line='【SUS】'+line;
          itemLines+='\n【'+(i+1)+'】'+line;
          itemLines+='\n　　数量：'+c.qty+' '+d.unit;
          if(c.note) itemLines+='\n　　備考：'+c.note;
          itemLines+='\n';
        });

        mailText+=supplier+' ご担当者様\n\n';
        mailText+='お世話になっております。\n'+requester+' でございます。\n\n';
        mailText+='下記につきまして、お見積りをお願いいたします。\n\n';
        mailText+='━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
        mailText+='■ 見積依頼日：'+today+'\n';
        mailText+='■ 依頼者　　：'+requester+'\n';
        mailText+='■ 希望納期　：'+delivery+'\n';
        if(globalNote) mailText+='■ 備考　　　：'+globalNote+'\n';
        mailText+='━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
        mailText+='■ 見積依頼品目（計'+entries.length+'品目）\n';
        mailText+=itemLines;
        mailText+='\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
        mailText+='お忙しいところ恐れ入りますが、何卒よろしくお願い申し上げます。\n\n以上';
      });

      document.getElementById('mailTextarea').value=mailText;
      document.getElementById('mailPanel').classList.add('visible');
      var btn=document.getElementById('copyBtn');
      btn.textContent='コピー'; btn.classList.remove('copied');
    }

    function copyMail(){
      var ta=document.getElementById('mailTextarea');
      ta.select();
      navigator.clipboard.writeText(ta.value).then(function(){
        var btn=document.getElementById('copyBtn');
        btn.textContent='✓ コピー済み'; btn.classList.add('copied');
        setTimeout(function(){ btn.textContent='コピー'; btn.classList.remove('copied'); },2000);
      });
    }
    function closeMail(){ document.getElementById('mailPanel').classList.remove('visible'); }

    // ══════ バージョン ══════
    window.addEventListener('DOMContentLoaded',function(){
      applyTheme(currentTheme);
      for(var n of document.head.childNodes){
        if(n.nodeType===Node.COMMENT_NODE&&n.nodeValue.includes('build:')){
          var parts=n.nodeValue.trim().replace('build:','').split('|').map(function(s){ return s.trim(); }).filter(Boolean);
          var ver=parts[0]||'--';
          var date=parts[1]?parts[1].replace(/(\d{4})(\d{2})(\d{2})/,'$1.$2.$3'):'';
          var el=document.getElementById('verBadge');
          if(el) el.textContent='見積依頼ツール ver.'+ver+(date?'  '+date:'');
          break;
        }
      }
    });

    init();
    // リサイズ時にスマホUI再初期化
    window.addEventListener('resize', function(){
      if(isMobile()){ adjustSpAppHeight(); }
      else { initSpUI(); }
    });
  </script>
</body>
</html>
