  <meta charset="UTF-8">

  <title>見積依頼ツール</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c1117;
      --surface: #161b22;
      --surface2: #1c2230;
      --border: #2a3444;
      --ink: #cdd9e5;
      --muted: #768390;
      --accent: #388bfd;
      --good: #3fb950;
      --warn: #d29922;
      --bad: #f85149;
      --orange: #f97316;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: 14px;
      -webkit-text-size-adjust: 100%;
    }

    /* ── HOME バー ── */
    .home-bar {
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 4px 16px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
    }
    .home-bar a {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      transition: color .2s;
    }
    .home-bar a:hover { color: var(--accent); }

    /* ── ヘッダー ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 8px 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--surface);
      flex-shrink: 0;
      flex-wrap: nowrap;
      overflow: hidden;
      min-height: 44px;
    }
    header h1 {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .badge-orange { border-color: var(--orange); color: var(--orange); }
    #verBadge {
      font-size: 9px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--muted);
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
      margin-left: auto;
      flex-shrink: 0;
    }
    @media (max-width: 480px) {
      header { padding: 6px 10px; gap: 6px; }
      header h1 { font-size: 12px; }
      #verBadge { display: none; }
    }

    /* ── アプリ本体 ── */
    .app {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── 左: 会社 + フィルターパネル ── */
    .left-panel {
      width: 200px;
      flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-section {
      padding: 12px 0 4px;
      border-bottom: 1px solid var(--border);
    }
    .panel-section:last-child { border-bottom: none; flex: 1; }

    .panel-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .12em;
      color: var(--muted);
      padding: 0 14px 6px;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }

    /* 会社リスト */
    .company-item {
      padding: 8px 14px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid transparent;
      transition: all .15s;
      color: var(--muted);
    }
    .company-item:hover { background: var(--surface2); color: var(--ink); }
    .company-item.active {
      background: var(--surface2);
      border-left-color: var(--orange);
      color: var(--orange);
      font-weight: 600;
    }

    /* 大分類フィルター */
    .cat-item {
      padding: 7px 14px;
      cursor: pointer;
      font-size: 12px;
      border-left: 3px solid transparent;
      transition: all .15s;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .cat-item:hover { background: var(--surface2); color: var(--ink); }
    .cat-item.active {
      background: rgba(56,139,253,.07);
      border-left-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .cat-count {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      background: var(--surface2);
      border-radius: 3px;
      padding: 1px 4px;
    }

    /* 品名検索 */
    .search-wrap { padding: 8px 10px; }
    .search-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 6px 8px;
      font-size: 11px;
      color: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .search-input::placeholder { color: var(--muted); }

    /* ── 中: 商品一覧 ── */
    .main {
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .section-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }
    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .section-line { flex: 1; height: 1px; background: var(--border); }
    .item-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
    }

    .items-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 8px;
    }

    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      cursor: pointer;
      transition: all .15s;
      position: relative;
    }
    .item-card:hover {
      background: var(--surface2);
      border-color: var(--accent);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(56,139,253,.08);
    }
    .item-card.in-cart {
      border-color: var(--good);
      background: rgba(63,185,80,.04);
    }

    .item-no {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      margin-bottom: 5px;
    }
    .item-name {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.5;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .item-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .item-price {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent);
      font-weight: 600;
      font-size: 12px;
    }
    .item-unit { color: var(--muted); font-size: 10px; }
    .cart-badge-card {
      position: absolute;
      top: 8px; right: 8px;
      background: var(--good);
      color: white;
      font-size: 9px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── 右: カートパネル ── */
    .cart-panel {
      width: 360px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .cart-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .cart-head-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      flex: 1;
    }
    .cart-count-badge {
      background: var(--orange);
      color: white;
      font-size: 10px;
      font-weight: 700;
      width: 18px; height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'JetBrains Mono', monospace;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .cart-empty {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 40px 0;
    }

    .cart-item {
      background: var(--surface2);
      border-radius: 6px;
      padding: 10px 12px;
      border: 1px solid var(--border);
    }
    .cart-item-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 8px;
      gap: 8px;
    }
    .cart-item-name {
      font-size: 11px;
      line-height: 1.5;
      color: var(--ink);
      flex: 1;
    }
    .cart-item-remove {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      padding: 0;
      line-height: 1;
      flex-shrink: 0;
      transition: color .1s;
    }
    .cart-item-remove:hover { color: var(--bad); }

    .cart-item-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .qty-ctrl {
      display: flex;
      align-items: center;
      gap: 2px;
      background: var(--bg);
      border-radius: 4px;
      padding: 2px 4px;
      border: 1px solid var(--border);
    }
    .qty-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      width: 22px; height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      transition: all .1s;
    }
    .qty-btn:hover { background: var(--border); color: var(--ink); }
    .qty-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 600;
      min-width: 22px;
      text-align: center;
      color: var(--ink);
    }
    .qty-unit { font-size: 10px; color: var(--muted); }

    .dim-row {
      display: flex;
      align-items: center;
      gap: 4px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 3px 7px;
      margin-bottom: 6px;
      font-size: 11px;
    }
    .dim-label { color: var(--muted); white-space: nowrap; font-size: 10px; }
    .dim-input {
      background: none;
      border: none;
      width: 100%;
      color: var(--ink);
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      outline: none;
    }

    .note-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 11px;
      color: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;
      resize: none;
      outline: none;
      transition: border-color .15s;
    }
    .note-input::placeholder { color: var(--muted); }
    .note-input:focus { border-color: var(--accent); }

    /* ── カートフッター ── */
    .cart-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .meta-label {
      color: var(--muted);
      width: 66px;
      flex-shrink: 0;
      font-size: 10px;
    }
    .meta-input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 7px;
      font-size: 12px;
      color: var(--ink);
      font-family: 'Noto Sans JP', sans-serif;
      outline: none;
      transition: border-color .15s;
    }
    .meta-input:focus { border-color: var(--accent); }

    .generate-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      letter-spacing: .04em;
      transition: all .15s;
      width: 100%;
    }
    .generate-btn:hover { background: #2d7df0; }
    .generate-btn:disabled { background: var(--border); color: var(--muted); cursor: not-allowed; }

    /* ── メールパネル ── */
    .mail-panel {
      width: 360px;
      flex-shrink: 0;
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .mail-panel.visible { display: flex; }

    .mail-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .mail-head-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--muted);
      text-transform: uppercase;
      flex: 1;
    }
    .copy-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--ink);
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Noto Sans JP', sans-serif;
      transition: all .15s;
    }
    .copy-btn:hover, .copy-btn.copied {
      background: var(--good);
      border-color: var(--good);
      color: white;
    }
    .close-btn {
      background: none;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 16px;
      padding: 0;
      line-height: 1;
      transition: color .1s;
    }
    .close-btn:hover { color: var(--bad); }

    .mail-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
    .mail-textarea {
      width: 100%;
      min-height: 400px;
      height: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 12px;
      font-size: 11px;
      line-height: 1.8;
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      resize: none;
      outline: none;
    }
    .mail-textarea:focus { border-color: var(--accent); }

    /* スクロールバー */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* 空表示 */
    .no-results {
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      padding: 40px 0;
    }
  </style>
</head>

  <!-- ── ヘッダー ── -->

  <!-- ── アプリ本体 ── -->
  <div class="app" id="app">

    <!-- 左: 会社 + 分類フィルター -->
    <div class="left-panel">

      <div class="panel-section">
        <div class="panel-label">発注先</div>
        <div id="companyList"></div>

      <div class="panel-section">

        </div>
        <div class="meta-row">
          <span class="meta-label">希望納期</span>
          <input class="meta-input" id="deliveryDate" type="date">
        </div>
        <div class="meta-row">
          <span class="meta-label">備考</span>
          <input class="meta-input" id="globalNote" type="text" placeholder="例）現場保管・至急 等">
        </div>
        <button class="generate-btn" id="generateBtn" onclick="generateMail()" disabled>
          📧 見積依頼メールを作成
        </button>
      </div>
    </div>

    <!-- 右右: メールパネル -->
    <div class="mail-panel" id="mailPanel">
      <div class="mail-head">
        <span class="mail-head-title">📧 メール本文</span>
        <button class="copy-btn" id="copyBtn" onclick="copyMail()">コピー</button>
        <button class="close-btn" onclick="closeMail()">✕</button>
      </div>
      <div class="mail-body">
        <textarea class="mail-textarea" id="mailTextarea" readonly></textarea>
      </div>
    </div>

  </div><!-- /.app -->

      {no:'J04970002', name:'角形鋼管　ｔ３．２×５０×５０×６０００', unit:'本', price:3034, supplier:'小川真功商店'},
      {no:'J04970001', name:'角形鋼管　ｔ３．２×４０×４０×６０００', unit:'本', price:3629, supplier:'小川真功商店'},
      {no:'J05120010', name:'平鋼　ｔ１６×１００×５５００',         unit:'本', price:9180, supplier:'小川真功商店'},
      {no:'J05120009', name:'平鋼　ｔ１２×１００×５５００',         unit:'本', price:6710, supplier:'小川真功商店'},

      {no:'J05120006', name:'平鋼　ｔ６×１００×５５００',          unit:'本', price:3360, supplier:'小川真功商店'},
      {no:'J05120005', name:'平鋼　ｔ６×５０×５５００',           unit:'本', price:1354, supplier:'小川真功商店'},
      {no:'J05120004', name:'平鋼　ｔ６×３８×５５００',           unit:'本', price:1062, supplier:'小川真功商店'},
      {no:'J05120003', name:'平鋼　ｔ４．５×１００×５５００',       unit:'本', price:2850, supplier:'小川真功商店'},
      {no:'J05120002', name:'平鋼　ｔ４．５×５０×５５００',        unit:'本', price:1082, supplier:'小川真功商店'},
      {no:'J05120001', name:'平鋼　ｔ４．５×３８×５５００',        unit:'本', price: 801, supplier:'小川真功商店'},
      {no:'J04980009', name:"鋼板　ｔ１６×３'×６'",              unit:'枚', price:25550, supplier:'小川真功商店'},
      {no:'J04980008', name:"鋼板　ｔ１２×３'×６'",              unit:'枚', price:15800, supplier:'小川真功商店'},
      {no:'J04980007', name:"鋼板　ｔ９．０×３'×６'（９１４×１８２９）", unit:'枚', price:9975, supplier:'小川真功商店'},
      {no:'J04980006', name:"鋼板　ｔ６．０×３'×６'（９１４×１８２９）", unit:'枚', price:6108, supplier:'小川真功商店'},
      {no:'J04980005', name:"鋼板　ｔ４．５×４'×８'（１２１９×２４３８）", unit:'枚', price:8876, supplier:'小川真功商店'},
      {no:'J04980004', name:"鋼板　ｔ４．５×３'×６'（９１４×１８２９）", unit:'枚', price:4570, supplier:'小川真功商店'},
      {no:'J04980003', name:"鋼板　ｔ３．２×３'×６'（９１４×１８２９）", unit:'枚', price:3247, supplier:'小川真功商店'},
      {no:'J04980002', name:"鋼板　ｔ２．３×３'×６'（９１４×１８２９）", unit:'枚', price:2397, supplier:'小川真功商店'},
      {no:'J04980001', name:"鋼板　ｔ１．６×３'×６'（９１４×１８２９）", unit:'枚', price:3547, supplier:'小川真功商店'},
    ];

    // ══════ カテゴリ分類 ══════
    var CATEGORIES = [
      { key: 'all',    label: 'すべて',                icon: '📦' },
      { key: 'plate',  label: '鋼板（定尺）',           icon: '🟫', match: function(n){ return n.includes('鋼板'); } },
      { key: 'angle',  label: '等辺山形鋼（アングル）', icon: '📐', match: function(n){ return n.includes('等辺山形鋼'); } },
      { key: 'pipe',   label: '配管（鋼管）',           icon: '🔩', match: function(n){ return n.includes('鋼管'); } },
      { key: 'channel',label: '溝形鋼（チャンネル）',   icon: '⊓',  match: function(n){ return n.includes('溝形鋼'); } },
      { key: 'sq',     label: '角形鋼管',               icon: '⬜', match: function(n){ return n.includes('角形鋼管'); } },
      { key: 'flat',   label: '平鋼（フラットバー）',   icon: '▬',  match: function(n){ return n.includes('平鋼'); } },
    ];

    var CAT_ORDER = ['plate','angle','pipe','channel','sq','flat'];

    function getCategory(name) {
      for (var i = 1; i < CATEGORIES.length; i++) {
        if (CATEGORIES[i].match(name)) return CATEGORIES[i].key;
      }
      return 'other';
    }

    // ══════ State ══════
    var selectedSupplier = null;
    var selectedCat = 'all';
    var searchQuery = '';
    var cart = {};

    // ══════ 初期化 ══════
    function init() {
      // 会社リスト
      var suppliers = [];
      RAW_DATA.forEach(function(d) {
        if (suppliers.indexOf(d.supplier) < 0) suppliers.push(d.supplier);
      });
      var cList = document.getElementById('companyList');
      cList.innerHTML = '';
      suppliers.forEach(function(s) {
        var div = document.createElement('div');
        div.className = 'company-item';
        div.textContent = s;
        div.onclick = function() { selectSupplier(s, div); };
        cList.appendChild(div);
      });

      // 大分類リスト（全件数カウント付き）
      buildCatList(suppliers[0] || null);

      // 1社しかなければ自動選択
      if (suppliers.length === 1) cList.children[0].click();
    }

    function buildCatList(supplier) {
      var items = supplier
        ? RAW_DATA.filter(function(d) { return d.supplier === supplier; })
        : RAW_DATA;

      var catList = document.getElementById('catList');
      catList.innerHTML = '';
      CATEGORIES.forEach(function(cat) {
        var cnt = cat.key === 'all'
          ? items.length
          : items.filter(function(d) { return getCategory(d.name) === cat.key; }).length;
        if (cat.key !== 'all' && cnt === 0) return;

        var div = document.createElement('div');
        div.className = 'cat-item' + (cat.key === selectedCat ? ' active' : '');
        div.setAttribute('data-cat', cat.key);
        div.innerHTML = cat.icon + ' ' + cat.label + '<span class="cat-count">' + cnt + '</span>';
        div.onclick = function() { selectCat(cat.key); };
        catList.appendChild(div);
      });
    }

    function selectSupplier(supplier, el) {
      selectedSupplier = supplier;
      document.querySelectorAll('.company-item').forEach(function(e) { e.classList.remove('active'); });
      el.classList.add('active');
      selectedCat = 'all';
      buildCatList(supplier);
      renderItems();
    }

    function selectCat(catKey) {
      selectedCat = catKey;
      document.querySelectorAll('.cat-item').forEach(function(e) {
        e.classList.toggle('active', e.getAttribute('data-cat') === catKey);
      });
      renderItems();
    }

    function filterItems() {
      searchQuery = document.getElementById('searchInput').value.trim();
      if (selectedSupplier) renderItems();
    }

    // ══════ 商品一覧レンダリング ══════
    function renderItems() {
      var main = document.getElementById('itemsMain');

      var items = RAW_DATA.filter(function(d) {
        if (d.supplier !== selectedSupplier) return false;
        if (selectedCat !== 'all' && getCategory(d.name) !== selectedCat) return false;
        if (searchQuery) {
          var q = searchQuery.toLowerCase();
          if (d.name.indexOf(searchQuery) < 0 && d.no.indexOf(searchQuery) < 0) return false;
        }
        return true;
      });

      if (!items.length) {
        main.innerHTML = '<div class="no-results">該当する品目がありません</div>';
        return;
      }

      // カテゴリ別グループ（大分類選択中は1グループのみ）
      var grouped = {};
      items.forEach(function(item) {
        var cat = getCategory(item.name);
        if (!grouped[cat]) grouped[cat] = [];
        grouped[cat].push(item);
      });

      var order = selectedCat === 'all' ? CAT_ORDER : [selectedCat];
      var html = '';
      order.forEach(function(catKey) {
        if (!grouped[catKey]) return;
        var catItems = grouped[catKey];
        var catInfo = CATEGORIES.find(function(c) { return c.key === catKey; }) || {label: catKey, icon: '📦'};
        html += '<div>';
        html += '<div class="section-header">';
        html += '<span class="section-title">' + catInfo.icon + ' ' + catInfo.label + '</span>';
        html += '<div class="section-line"></div>';
        html += '<span class="item-count">' + catItems.length + '品目</span>';
        html += '</div>';
        html += '<div class="items-grid">';
        catItems.forEach(function(item) {
          var inCart = !!cart[item.no];
          var cartQty = inCart ? cart[item.no].qty : 0;
          html += '<div class="item-card' + (inCart ? ' in-cart' : '') + '" id="card-' + item.no + '" onclick="addToCart(\'' + item.no + '\')">';
          if (inCart) html += '<span class="cart-badge-card">×' + cartQty + '</span>';
          html += '<div class="item-no">' + item.no + '</div>';
          html += '<div class="item-name">' + item.name + '</div>';
          html += '<div class="item-meta">';
          html += '<span class="item-price">¥' + item.price.toLocaleString() + '</span>';
          html += '<span class="item-unit">/ ' + item.unit + '</span>';
          html += '</div></div>';
        });
        html += '</div></div>';
      });

      main.innerHTML = html;
    }

    // ══════ カート操作 ══════
    function addToCart(no) {
      var item = RAW_DATA.find(function(d) { return d.no === no; });
      if (!item) return;
      if (!cart[no]) {
        cart[no] = { item: item, qty: 1, note: '', cutLength: '' };
      } else {
        cart[no].qty++;
      }
      renderCart();
      renderItems();
      updateBtn();
    }

    function removeFromCart(no) {
      delete cart[no];
      renderCart();
      renderItems();
      updateBtn();
    }

    function changeQty(no, delta) {
      if (!cart[no]) return;
      cart[no].qty = Math.max(1, cart[no].qty + delta);
      renderCart();
      renderItems();
    }

    function updateNote(no, val) { if (cart[no]) cart[no].note = val; }
    function updateCutLength(no, val) { if (cart[no]) cart[no].cutLength = val; }

    function renderCart() {
      var keys = Object.keys(cart);
      document.getElementById('cartCountBadge').textContent = keys.length;

      var container = document.getElementById('cartItems');
      if (!keys.length) {
        container.innerHTML = '<div class="cart-empty">品目カードをクリックして追加</div>';
        return;
      }

      var html = '';
      keys.forEach(function(no) {
        var c = cart[no];
        html += '<div class="cart-item">';
        html += '<div class="cart-item-top">';
        html += '<div class="cart-item-name">' + c.item.name + '</div>';
        html += '<button class="cart-item-remove" onclick="removeFromCart(\'' + no + '\')">✕</button>';
        html += '</div>';
        html += '<div class="cart-item-controls">';
        html += '<div class="qty-ctrl">';
        html += '<button class="qty-btn" onclick="changeQty(\'' + no + '\',-1)">－</button>';
        html += '<span class="qty-value">' + c.qty + '</span>';
        html += '<button class="qty-btn" onclick="changeQty(\'' + no + '\',+1)">＋</button>';
        html += '</div>';
        html += '<span class="qty-unit">' + c.item.unit + '</span>';
        html += '</div>';
        html += '<div class="dim-row">';
        html += '<span class="dim-label">切断寸法</span>';
        html += '<input class="dim-input" type="text" placeholder="例）500mm" value="' + (c.cutLength||'') + '"';
        html += ' onchange="updateCutLength(\'' + no + '\',this.value)" oninput="updateCutLength(\'' + no + '\',this.value)">';
        html += '</div>';
        html += '<textarea class="note-input" rows="2" placeholder="品目備考（用途・仕様補足など）"';
        html += ' onchange="updateNote(\'' + no + '\',this.value)" oninput="updateNote(\'' + no + '\',this.value)">' + (c.note||'') + '</textarea>';
        html += '</div>';
      });
      container.innerHTML = html;
    }

    function updateBtn() {
      document.getElementById('generateBtn').disabled = Object.keys(cart).length === 0;
    }

    // ══════ メール生成 ══════
    function generateMail() {
      var keys = Object.keys(cart);
      if (!keys.length) return;

      var requester = document.getElementById('requesterName').value || '（依頼者名未入力）';
      var deliveryRaw = document.getElementById('deliveryDate').value;
      var delivery = deliveryRaw
        ? new Date(deliveryRaw).toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric'})
        : '（希望納期未入力）';
      var globalNote = document.getElementById('globalNote').value;

      var bySupplier = {};
      keys.forEach(function(no) {
        var c = cart[no];
        var s = c.item.supplier;
        if (!bySupplier[s]) bySupplier[s] = [];
        bySupplier[s].push(c);
      });

      var today = new Date().toLocaleDateString('ja-JP', {year:'numeric', month:'long', day:'numeric'});
      var mailText = '';

      Object.keys(bySupplier).forEach(function(supplier) {
        var entries = bySupplier[supplier];
        var itemLines = '';
        entries.forEach(function(e, i) {
          itemLines += '\n【' + (i+1) + '】' + e.item.name;
          if (e.cutLength) itemLines += '\n　　切断寸法：' + e.cutLength;
          itemLines += '\n　　数量：' + e.qty + ' ' + e.item.unit;
          if (e.note) itemLines += '\n　　備考：' + e.note;
          itemLines += '\n';
        });

        mailText += supplier + ' ご担当者様\n\n';
        mailText += 'お世話になっております。\n' + requester + ' でございます。\n\n';
        mailText += '下記につきまして、お見積りをお願いいたします。\n\n';
        mailText += '━━━━━━━━━━━━━━━━━━━━━━━━━━\n';
        mailText += '■ 見積依頼日：' + today + '\n';
        mailText += '■ 依頼者　　：' + requester + '\n';
        mailText += '■ 希望納期　：' + delivery + '\n';
        if (globalNote) mailText += '■ 備考　　　：' + globalNote + '\n';
        mailText += '━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
        mailText += '■ 見積依頼品目（計' + entries.length + '品目）\n';
        mailText += itemLines;
        mailText += '\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n';
        mailText += 'お忙しいところ恐れ入りますが、何卒よろしくお願い申し上げます。\n\n以上';
      });

      document.getElementById('mailTextarea').value = mailText;
      document.getElementById('mailPanel').classList.add('visible');
      var btn = document.getElementById('copyBtn');
      btn.textContent = 'コピー';
      btn.classList.remove('copied');
    }

    function copyMail() {
      var ta = document.getElementById('mailTextarea');
      ta.select();
      navigator.clipboard.writeText(ta.value).then(function() {
        var btn = document.getElementById('copyBtn');
        btn.textContent = '✓ コピー済み';
        btn.classList.add('copied');
        setTimeout(function() {
          btn.textContent = 'コピー';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    function closeMail() {
      document.getElementById('mailPanel').classList.remove('visible');
    }

    // ══════ バージョン情報をコメントから読み込み ══════
    window.addEventListener('DOMContentLoaded', function() {
      for (var n of document.head.childNodes) {
        if (n.nodeType === Node.COMMENT_NODE && n.nodeValue.includes('build:')) {
          var parts = n.nodeValue.trim().replace('build:', '').split('|').map(function(s) { return s.trim(); }).filter(Boolean);
          var ver = parts[0] || '--';
          var date = parts[1] ? parts[1].replace(/(\d{4})(\d{2})(\d{2})/, '$1.$2.$3') : '';
          var el = document.getElementById('verBadge');
          if (el) el.textContent = '見積依頼ツール ver.' + ver + (date ? '  ' + date : '');
          break;
        }
      }
    });

    init();
  </script>
