  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "uk-capex",
    "url": "https://uk-capex.com/",
    "description": "製造現場のエンジニア　Webツール集"
  }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0c1117;
      --surface: #161b22;
      --surface2: #1c2230;
      --border: #2a3444;
      --ink: #cdd9e5;
      --muted: #768390;
      --accent: #388bfd;
      --good: #3fb950;
      --estimate: #e3b341;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 2px,
        rgba(56,139,253,0.02) 2px, rgba(56,139,253,0.02) 4px
      );
      pointer-events: none; z-index: 0;
    }

    /* ── ヘッダー ── */
    header {
      position: relative; z-index: 10;
      padding: 16px 20px;
      background: rgba(22,27,34,0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .logo {
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px; font-weight: 600;
      color: var(--ink); letter-spacing: 2px;
      text-decoration: none;
    }
    .logo span { color: var(--accent); }

    .header-sub {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; color: var(--muted); letter-spacing: 1px;
    }

    /* ── ヒーロー ── */
    .hero {
      position: relative; z-index: 1;
      overflow: hidden;
      padding: 52px 20px 44px;
      text-align: center;
    }

    .hero::after {
      content: '';
      position: absolute;
      top: -60px; left: 50%; transform: translateX(-50%);
      width: 600px; height: 300px;
      background: radial-gradient(ellipse at center,
        rgba(56,139,253,0.09) 0%,
        rgba(63,185,80,0.03) 50%,
        transparent 72%
      );
      pointer-events: none;
    }

    .hero-eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; letter-spacing: 4px;
      color: var(--accent); text-transform: uppercase;
      margin-bottom: 16px;
      display: flex; align-items: center; justify-content: center; gap: 12px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.1s forwards;
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: ''; width: 28px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent));
      opacity: 0.5;
    }
    .hero-eyebrow::after {
      background: linear-gradient(90deg, var(--accent), transparent);
    }

    .hero-title {
      font-size: clamp(22px, 6vw, 36px);
      font-weight: 700; line-height: 1.5;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.2s forwards;
    }
    .hero-title .hl-blue   { color: var(--accent); }
    .hero-title .hl-green  { color: var(--good); }
    .hero-title .hl-yellow { color: var(--estimate); }

    .hero-badges {
      display: flex; justify-content: center;
      gap: 8px; flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.3s forwards;
    }
    .hero-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600;
      padding: 4px 11px; border-radius: 20px;
      letter-spacing: 0.5px;
    }
    .badge-blue   { background: rgba(56,139,253,0.10);  color: var(--accent);   border: 1px solid rgba(56,139,253,0.22); }
    .badge-green  { background: rgba(63,185,80,0.10);   color: var(--good);     border: 1px solid rgba(63,185,80,0.22); }
    .badge-yellow { background: rgba(227,179,65,0.10);  color: var(--estimate); border: 1px solid rgba(227,179,65,0.22); }
    .badge-gray   { background: rgba(118,131,144,0.10); color: var(--muted);    border: 1px solid rgba(118,131,144,0.22); }

    /* ── 仕切り ── */
    .divider {
      position: relative; z-index: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 20%, var(--border) 80%, transparent);
      margin: 0 16px;
    }

    /* ── セクション ── */
    .main-section {
      position: relative; z-index: 1;
      max-width: 860px; margin: 0 auto;
      padding: 0 16px;
      width: 100%;
      opacity: 0;
      animation: fadeUp 0.5s ease 0.4s forwards;
    }

    .section-label {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 14px; padding-top: 32px;
    }
    .section-label-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px; font-weight: 600;
      letter-spacing: 3px; text-transform: uppercase;
      white-space: nowrap; color: var(--accent);
    }
    .section-label-line {
      flex: 1; height: 1px; background: var(--border);
    }

    /* ── カード（スマホ: 横長リスト） ── */
    .main-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 48px;
    }

    .main-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      text-decoration: none;
      color: var(--ink);
      display: flex; flex-direction: row;
      align-items: stretch;
      transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
    }
    .main-card:active {
      background: var(--surface2);
      transform: scale(0.99);
    }

    .main-card.card-mech  { border-left: 3px solid var(--accent); }
    .main-card.card-lathe { border-left: 3px solid var(--good); }
    .main-card.card-elec  { border-left: 3px solid var(--estimate); }

    .main-card-body {
      padding: 18px 16px;
      flex: 1;
      display: flex; align-items: center; gap: 14px;
    }

    .main-card-icon { font-size: 24px; flex-shrink: 0; }

    .main-card-text { flex: 1; }

    .main-card-title {
      font-size: 14px; font-weight: 700;
      color: var(--ink); line-height: 1.4;
      margin-bottom: 3px;
    }

    .main-card-desc {
      font-size: 11px; color: var(--muted);
      line-height: 1.7; font-weight: 300;
    }

    .main-card-cta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px; font-weight: 600;
      padding: 0 18px;
      display: flex; align-items: center;
      border-left: 1px solid var(--border);
      flex-shrink: 0;
    }
    .cta-mech  { color: var(--accent); }
    .cta-lathe { color: var(--good); }
    .cta-elec  { color: var(--estimate); }

    /* ── フッター ── */
    footer {
      position: relative; z-index: 1;
      margin-top: auto;
      border-top: 1px solid var(--border);
      padding: 16px 20px; text-align: center;
      background: var(--surface);
    }
    .footer-copy {
      font-size: 11px; color: #3a4a5a;
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── アニメーション ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── タブレット・PC: 3列カード ── */
    @media (min-width: 640px) {
      header { padding: 18px 32px; }
      .hero { padding: 72px 24px 60px; }
      .divider { margin: 0 24px; }
      .main-section { padding: 0 24px; }

      .main-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .main-card {
        flex-direction: column;
      }
      .main-card.card-mech  { border-left: none; border-top: 3px solid var(--accent); }
      .main-card.card-lathe { border-left: none; border-top: 3px solid var(--good); }
      .main-card.card-elec  { border-left: none; border-top: 3px solid var(--estimate); }
      .main-card:hover {
        background: var(--surface2);
        transform: translateY(-3px);
      }
      .main-card.card-mech:hover  { box-shadow: 0 6px 24px rgba(56,139,253,0.10); }
      .main-card.card-lathe:hover { box-shadow: 0 6px 24px rgba(63,185,80,0.10); }
      .main-card.card-elec:hover  { box-shadow: 0 6px 24px rgba(227,179,65,0.10); }
      .main-card-body {
        flex-direction: column; align-items: flex-start; gap: 10px;
        padding: 24px 22px 16px; flex: 1;
      }
      .main-card-icon { font-size: 28px; }
      .main-card-title { font-size: 15px; margin-bottom: 0; }
      .main-card-desc { font-size: 12px; }
      .main-card-cta {
        border-left: none;
        border-top: 1px solid var(--border);
        width: 100%; padding: 12px 22px;
        justify-content: flex-end;
      }
    }
  </style>
</head>
