<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ポトフォ・ウォッチ</title>
<style>
:root{
  --bg:#12141a; --surface:#1a1e27; --surface2:#222734; --border:#2c3242;
  --text:#e7e9ee; --muted:#8b93a7; --dim:#5b6275;
  --amber:#f5a623; --amber-dim:rgba(245,166,35,.12);
  --teal:#4fd1c5; --red:#ff5c5c; --red-dim:rgba(255,92,92,.12);
  --core:#6ea8fe; --watch:#f5c86e; --lottery:#c792ea;
  --mono:ui-monospace,'SF Mono','Cascadia Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 80px}
/* header */
header{position:sticky;top:0;z-index:20;background:linear-gradient(var(--bg) 85%,transparent);padding:14px 0 8px}
.hd-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-size:17px;font-weight:700;letter-spacing:.04em}
h1 .sub{font-size:10px;color:var(--dim);font-weight:400;margin-left:6px}
.fx{font-family:var(--mono);font-size:12px;color:var(--muted);text-align:right}
.fx b{color:var(--text);font-size:14px}
.fx.hot b{color:var(--red)}
.hd-bar{display:flex;align-items:center;gap:10px;margin-top:8px}
.btn-grp{display:flex;gap:6px;flex-wrap:wrap}
.btn-sm{font-size:12px!important;padding:7px 12px!important;border-radius:8px!important;font-weight:600!important}
.btn-all{background:var(--surface2);color:var(--text)}
.card-upd{background:transparent;color:var(--dim);font-size:11px;padding:3px 8px;border:1px solid var(--border);border-radius:20px;margin-left:auto}
.card-upd:active{color:var(--teal);border-color:var(--teal)}
.card-foot{display:flex;margin-top:8px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:8px}
.btn-update{background:var(--teal);color:#0b2f2c;font-weight:700;font-size:14px;padding:9px 20px;border-radius:10px;transition:opacity .15s}
.btn-update:disabled{opacity:.45;cursor:wait}
.upd-meta{font-size:11px;color:var(--muted);flex:1}
.upd-meta .stale{color:var(--amber)}
#progress{font-size:11px;color:var(--teal);min-height:16px;margin-top:4px;font-family:var(--mono)}
/* tabs */
nav{display:flex;gap:4px;margin:10px 0 14px;background:var(--surface);border-radius:10px;padding:4px}
nav button{flex:1;background:transparent;color:var(--muted);font-size:12.5px;padding:7px 0;border-radius:7px;font-weight:600}
nav button.on{background:var(--surface2);color:var(--text)}
/* alert band */
.alert-band{border:1px solid var(--amber);background:var(--amber-dim);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.alert-band.err{border-color:var(--red);background:var(--red-dim)}
.alert-band .t{font-weight:700;font-size:13px;margin-bottom:2px}
.alert-band .t.amber{color:var(--amber)}
.alert-band .t.red{color:var(--red)}
.alert-band li{list-style:none;font-size:12.5px;color:var(--text);margin-top:2px}
/* tier groups */
.tier-h{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--muted);margin:20px 2px 8px}
.tier-h::after{content:'';flex:1;height:1px;background:var(--border)}
/* card */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px;position:relative}
.card.lit{border-color:var(--amber);box-shadow:0 0 0 1px var(--amber),0 0 22px -6px rgba(245,166,35,.5)}
.card.anom{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.c-head{display:flex;align-items:baseline;gap:8px}
.c-name{font-weight:700;font-size:15px}
.c-code{font-family:var(--mono);font-size:11px;color:var(--dim)}
.badge{margin-left:auto;font-size:10px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.badge.lit-b{background:var(--amber);color:#3a2800}
.badge.ok-b{background:var(--surface2);color:var(--muted)}
.badge.anom-b{background:var(--red);color:#fff}
.c-price{display:flex;align-items:baseline;gap:8px;margin-top:7px;flex-wrap:wrap}
.c-price .p{font-family:var(--mono);font-size:21px;font-weight:600}
.c-price .p.none{color:var(--dim);font-size:14px}
.c-asof{font-size:10.5px;color:var(--dim);font-family:var(--mono)}
.c-asof.stale{color:var(--amber)}
.c-ind{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px}
.c-ind .stale{color:var(--amber)}
.c-hold{font-size:11.5px;color:var(--muted);margin-top:4px;font-family:var(--mono)}
.c-hold .pos{color:var(--teal)}.c-hold .neg{color:var(--red)}
.c-thesis{font-size:11.5px;color:var(--muted);margin-top:7px;line-height:1.5}
/* trigger rows */
.trg{margin-top:9px;padding-top:9px;border-top:1px dashed var(--border)}
.trg-row{display:flex;align-items:center;gap:8px;margin-top:5px}
.trg-row:first-child{margin-top:0}
.trg-lbl{font-size:11px;color:var(--muted);width:38%;min-width:110px}
.trg-lbl b{color:var(--text);font-family:var(--mono);font-weight:600}
.gauge{flex:1;height:5px;background:var(--surface2);border-radius:3px;overflow:hidden}
.gauge i{display:block;height:100%;background:var(--dim);border-radius:3px;transition:width .3s}
.trg-row.hit .gauge i{background:var(--amber)}
.trg-dist{font-family:var(--mono);font-size:11px;color:var(--muted);width:58px;text-align:right}
.trg-row.hit .trg-dist{color:var(--amber);font-weight:700}
/* dip section on lit card */
.dip{margin-top:10px;background:var(--amber-dim);border-radius:10px;padding:9px 11px}
.dip h4{font-size:11px;color:var(--amber);font-weight:700;margin-bottom:4px}
.dip ul{padding-left:16px;font-size:12px;margin-bottom:6px}
.dip .sum{font-size:12px;line-height:1.55}
.dip .sum-asof{font-size:10px;color:var(--dim);font-family:var(--mono);margin-top:3px}
.anom-msg{margin-top:8px;background:var(--red-dim);border-radius:8px;padding:7px 10px;font-size:12px;color:var(--red)}
.c-notes{font-size:11px;color:var(--dim);margin-top:7px;line-height:1.5}
/* calendar */
.cal-row{display:flex;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-bottom:8px;align-items:center}
.cal-row.now{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.cal-date{font-family:var(--mono);font-size:12px;color:var(--muted);width:86px;flex-shrink:0}
.cal-row.now .cal-date{color:var(--teal);font-weight:700}
.cal-name{font-weight:600;font-size:13.5px}
.cal-chk{font-size:11px;color:var(--muted);margin-top:1px}
.cal-now-tag{margin-left:auto;font-size:10px;background:var(--teal);color:#0b2f2c;font-weight:700;padding:2px 8px;border-radius:20px;flex-shrink:0}
.cal-past{opacity:.4}
/* log */
.log-entry{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px 13px;margin-bottom:8px}
.log-ts{font-family:var(--mono);font-size:11px;color:var(--teal)}
.log-body{font-size:12px;color:var(--muted);margin-top:3px;white-space:pre-wrap;word-break:break-all}
.log-body b{color:var(--amber)}
.memo-box{display:flex;gap:8px;margin-bottom:14px}
.memo-box input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit}
.memo-box button{background:var(--surface2);color:var(--text);padding:0 16px;font-weight:600}
/* settings */
.set-sec{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px 13px;margin-bottom:12px}
.set-sec h3{font-size:13px;margin-bottom:8px}
.set-stock{padding:8px 0;border-top:1px solid var(--border)}
.set-stock:first-of-type{border-top:none}
.set-sname{font-size:12.5px;font-weight:600;margin-bottom:4px}
.set-trow{display:flex;gap:6px;margin-top:4px;align-items:center}
.set-trow input{background:var(--bg);border:1px solid var(--border);border-radius:7px;color:var(--text);padding:5px 8px;font-size:12px;font-family:var(--mono)}
.set-trow .in-lbl{flex:1;font-family:inherit}
.set-trow .in-val{width:88px}
.set-trow .del{background:transparent;color:var(--dim);font-size:15px;padding:2px 6px}
.set-add{background:transparent;color:var(--teal);font-size:11.5px;padding:4px 0;margin-top:3px}
textarea{width:100%;height:200px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:var(--mono);font-size:11px;padding:10px;resize:vertical}
.set-btns{display:flex;gap:8px;margin-top:8px}
.set-btns button{background:var(--surface2);color:var(--text);padding:8px 16px;font-weight:600;font-size:12.5px}
.set-btns button.pri{background:var(--teal);color:#0b2f2c}
.hint{font-size:11px;color:var(--dim);margin-top:6px;line-height:1.5}
/* toast */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:9px 18px;border-radius:20px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;max-width:90%}
#toast.show{opacity:1}
.empty{color:var(--dim);font-size:12.5px;text-align:center;padding:30px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hd-top">
      <h1>ポトフォ・ウォッチ<span class="sub">v1.1 公開用 / 判断材料の整理・助言ではない</span></h1>
      <div class="fx" id="fxBox">USD/JPY<br><b>—</b></div>
    </div>
    <div class="hd-bar">
      <div class="btn-grp">
        <button class="btn-update btn-sm" id="btnUpdCore">🎯本命</button>
        <button class="btn-update btn-sm" id="btnUpdWatch">🟡ウォッチ</button>
        <button class="btn-update btn-sm" id="btnUpdLottery">🎰宝くじ</button>
        <button class="btn-update btn-sm btn-all" id="btnUpdAll">全銘柄</button>
      </div>
    </div>
    <div class="upd-meta" id="updMeta">未更新</div>
    <div id="progress"></div>
    <nav>
      <button data-tab="home" class="on">ホーム</button>
      <button data-tab="cal">決算</button>
      <button data-tab="log">ログ</button>
      <button data-tab="set">設定</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script>
/* ============ 初期データ（空テンプレート・公開用） ============ */
/* 公開リンク・リミックスでコードごと他人に見える前提のため、個人の保有株数・
   取得単価・トリガー等はコードに含めない。初回は「設定タブ→インポート」で
   自分のバックアップJSON（portfolio-backup_YYYY-MM-DD.json）を読み込んで使う。 */
const SEED = {
  meta: { version: 1, source: "empty-template", fx_note: "" },
  stocks: [],
  macro_watch: [],
  logs: [],
  fetched: {},   // { [id]: {price, yield_pct, per, as_of, alert, fetchedAt, dip_summary, dip_at} }
  fx: null       // {rate, as_of, fetchedAt}
};

const STORAGE_KEY = 'portfolio-data';
const TIERS = [
  {key:'core',    label:'🎯 本命枠'},
  {key:'watch',   label:'🟡 土台・ウォッチ'},
  {key:'lottery', label:'🎰 宝くじ枠'}
];
const H24 = 24*3600*1000, D7 = 7*24*3600*1000;
let state = null;
let curTab = 'home';

/* ============ util ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function fmtTs(ms){ if(!ms) return '—'; const d=new Date(ms); return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function fmtPrice(v, market){ if(v==null||isNaN(v)) return null; const n = Number(v); const s = n>=1000 ? n.toLocaleString('ja-JP',{maximumFractionDigits:1}) : n.toLocaleString('ja-JP',{maximumFractionDigits:2}); return market==='US' ? '$'+s : '¥'+s; }
function age(ms){ return ms ? Date.now()-ms : Infinity; }

/* ============ 環境チェック ============ */
let envOk = true;
function checkEnv(){
  if(typeof window.storage === 'undefined'){
    envOk = false;
    // メモリ内フォールバック（保存はされない）
    window.storage = {
      _m:{}, 
      async get(k){ return this._m[k] ? {key:k, value:this._m[k]} : null; },
      async set(k,v){ this._m[k]=v; return {key:k, value:v}; },
      async delete(k){ delete this._m[k]; return {key:k, deleted:true}; },
      async list(){ return {keys:Object.keys(this._m)}; }
    };
    const w = document.createElement('div');
    w.className = 'alert-band err';
    w.style.margin = '0 0 10px';
    w.innerHTML = `<div class="t red">⚠️ アーティファクト環境の外で開いている</div>
      <li>このツールはClaudeアプリ内でアーティファクトとして開いた時だけフル動作する（API・保存が環境側で処理される仕組み）。</li>
      <li>ローカルやブラウザ単体では「更新」は全滅し、データも保存されない。Claudeのチャットからアーティファクトを開き直して。</li>`;
    document.querySelector('header').after(w);
  }
}

/* ============ storage（タイムアウト保護つき） ============ */
const withTimeout = (p, ms, label) => Promise.race([
  p,
  new Promise((_,rej)=>setTimeout(()=>rej(new Error((label||'storage')+'タイムアウト')), ms))
]);
let storageDead = false;
async function loadState(){
  try{
    const r = await withTimeout(window.storage.get(STORAGE_KEY), 5000, '読込');
    if(r && r.value) state = JSON.parse(r.value);
  }catch(e){
    if(e.message.includes('タイムアウト')){ storageDead = true; toast('⚠️ 保存領域が応答しない→メモリ内モードで起動'); }
    /* キーなしはここに来るだけなので無視 */
  }
  if(!state || !Array.isArray(state.stocks)){
    state = JSON.parse(JSON.stringify(SEED));
    saveState(); // 待たない
  }
  state.fetched = state.fetched || {};
  state.logs = state.logs || [];
  if(!state.stocks.length){
    setTimeout(()=>toast('データが空。設定タブ→インポートで自分のバックアップJSONを読み込んで'), 400);
  }
}
async function saveState(){
  try{
    const r = await withTimeout(window.storage.set(STORAGE_KEY, JSON.stringify(state)), 4000, '保存');
    if(!r) toast('⚠️ 保存に失敗した可能性');
    if(storageDead){ storageDead = false; toast('✅ 保存が復旧した'); }
  }catch(e){
    if(!storageDead){
      storageDead = true;
      toast('⚠️ 保存が応答しない（環境不調）。表示は反映済み、閉じると消えるのでエクスポート推奨');
    }
  }
}

/* ============ Claude API ============ */
const sleep = ms => new Promise(r=>setTimeout(r,ms));
function fmtResetTime(unixSec){
  if(!unixSec) return null;
  const d = new Date(unixSec*1000);
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
async function callClaude(prompt, useSearch){
  const body = {
    model: 'claude-sonnet-4-6',
    max_tokens: 1000,
    messages: [{role:'user', content: prompt}]
  };
  if(useSearch) body.tools = [{type:'web_search_20250305', name:'web_search'}];
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if(!res.ok){
    let detail = '', resetsAt = null;
    try{
      const raw = await res.text();
      detail = raw.slice(0,140);
      // rate_limit_error本文からresetsAt（Unix秒）を拾う。ネストしたJSON文字列内にある想定でゆるく正規表現抽出
      const m = raw.match(/"resetsAt"\s*:\s*(\d+)/);
      if(m) resetsAt = Number(m[1]);
    }catch(e){}
    const err = new Error(`API ${res.status}${detail?': '+detail:''}`);
    err.status = res.status;
    err.resetsAt = resetsAt;
    throw err;
  }
  const data = await res.json();
  if(data.error) throw new Error('API error: '+(data.error.message||JSON.stringify(data.error)).slice(0,140));
  return (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
}
function parseJsonLoose(text){
  const clean = text.replace(/```json|```/g,'').trim();
  const m = clean.match(/\{[\s\S]*\}/);
  return JSON.parse(m ? m[0] : clean);
}

/* ============ トリガー判定（機械的・数値比較のみ） ============ */
function evalTrigger(stock, trg){
  const f = state.fetched[stock.id];
  if(!f || f.price==null) return {hit:false, dist:null};
  if(trg.type === 'price_below'){
    const dist = (f.price - trg.value) / trg.value * 100; // +なら未達、0以下で点灯
    return {hit: f.price <= trg.value, dist};
  }
  return {hit:false, dist:null};
}
function litStocks(){
  return state.stocks.filter(s => (s.triggers||[]).some(t => evalTrigger(s,t).hit));
}
function anomStocks(){
  return state.stocks.filter(s => state.fetched[s.id]?.alert);
}

/* ============ 更新フロー ============ */
function buildBatchPrompt(batch, withFx){
  const lines = batch.map(s => `- ${s.id} ${s.name}（${s.market==='JP'?'東証':'米国市場'}）`).join('\n');
  let p = `以下の銘柄の「現在株価」「予想配当利回り(%)」「予想PER」をweb検索で調べて、JSONのみで返答してください。前置き・説明・Markdownフェンスは一切禁止。\n`;
  p += `形式: {"9432": {"price": 148.0, "yield_pct": 3.65, "per": 12.1, "as_of": "2026-07-19", "alert": null}}\n`;
  p += `ルール: 東証銘柄は円建て、米国銘柄はUSD建ての数値。as_ofは株価の日付。不明な値はnull。上場廃止・取引停止・株式併合・TOBなど通常取引に関わる異常を検知したら alert フィールドに日本語で簡潔に記載（なければnull）。\n`;
  p += `銘柄:\n${lines}`;
  if(withFx) p += `\nさらに "USDJPY" キーで現在のドル円レートを {"price": 162.4, "as_of": "..."} 形式で含めること。`;
  return p;
}
function buildDipPrompt(stock){
  const chk = (stock.dip_checklist||[]).join(' / ') || '重要ニュース全般';
  return `「${stock.name}（${stock.id}）」の直近1〜2週間のニュース・開示をweb検索し、次のチェック項目の観点だけで日本語200字以内に要約してください。チェック項目: ${chk}\n買い推奨・売り推奨は書かない。事実のみ。JSONのみで返答（フェンス禁止）: {"summary": "…"}`;
}

async function batchOnce(batch, withFx){
  const text = await callClaude(buildBatchPrompt(batch, withFx), true);
  try{ return parseJsonLoose(text); }
  catch(e){ throw new Error('JSONパース失敗: '+text.slice(0,120)); }
}
// バックオフつきリトライ（500系はしつこく待って再試行／429は待っても解消しないため即座に投げ直す）
async function batchWithRetry(batch, withFx, progLabel){
  const waits = [0, 2500, 6000];
  let lastErr = null;
  for(let a=0; a<waits.length; a++){
    if(waits[a]){ $('#progress').textContent = `${progLabel} 再試行${a}/2（${waits[a]/1000}秒待機）`; await sleep(waits[a]); }
    try{ return await batchOnce(batch, withFx); }
    catch(e){
      if(e.status === 429) throw e; // 枠切れはリトライ無意味。即座に呼び出し元へ
      lastErr = e;
    }
  }
  throw lastErr;
}

async function runUpdate(targetStocks, scopeLabel){
  const target = targetStocks && targetStocks.length ? targetStocks : state.stocks;
  if(!target.length){
    toast('銘柄データが空。先に設定タブ→インポートでJSONを読み込んで');
    return;
  }
  const btns = [$('#btnUpdCore'), $('#btnUpdWatch'), $('#btnUpdLottery'), $('#btnUpdAll')];
  btns.forEach(b=>b && (b.disabled = true));
  const prog = $('#progress');
  const now = Date.now();
  const failed = [];
  const errors = [];
  let rateLimited = false;
  let resetsAtSec = null;
  // バッチ分割（6銘柄ずつ・呼び出し回数を減らして429を避ける）
  const stocks = target.slice();
  const batches = [];
  for(let i=0;i<stocks.length;i+=6) batches.push(stocks.slice(i,i+6));

  for(let bi=0; bi<batches.length && !rateLimited; bi++){
    const label = `更新中… バッチ ${bi+1}/${batches.length}`;
    prog.textContent = label;
    const batch = batches[bi];
    let parsed = null;
    try{ parsed = await batchWithRetry(batch, bi===0, label); }
    catch(e){
      if(e.status === 429){
        rateLimited = true; resetsAtSec = e.resetsAt;
        batch.forEach(s=>{ if(!failed.includes(s.id)) failed.push(s.id); });
        errors.push('枠切れ（429）のためここで中断');
        break;
      }
      // フォールバック：1銘柄ずつ単発で取りにいく（小さいリクエストは落ちにくい）
      console.error('batch fail → 単発フォールバック', e);
      parsed = {};
      for(let si=0; si<batch.length && !rateLimited; si++){
        const s = batch[si];
        prog.textContent = `${label} 単発取得 ${s.name}`;
        await sleep(1200);
        try{
          const single = await batchOnce([s], bi===0 && si===0);
          Object.assign(parsed, single);
        }catch(e2){
          if(e2.status === 429){
            rateLimited = true; resetsAtSec = e2.resetsAt;
            errors.push('枠切れ（429）のためここで中断');
            // このバッチの残り銘柄も失敗扱いに
            for(let sj=si; sj<batch.length; sj++){ if(!failed.includes(batch[sj].id)) failed.push(batch[sj].id); }
            break;
          }
          failed.push(s.id);
          errors.push(`${s.name}: ${e2.message}`);
        }
      }
    }
    if(rateLimited) break;
    if(!parsed || !Object.keys(parsed).length){
      batch.forEach(s=>{ if(!failed.includes(s.id)) failed.push(s.id); });
      continue;
    }
    // FX
    if(parsed.USDJPY && parsed.USDJPY.price != null){
      state.fx = { rate: Number(parsed.USDJPY.price), as_of: parsed.USDJPY.as_of||null, fetchedAt: now };
    }
    for(const s of batch){
      const r = parsed[s.id];
      if(!r || r.price == null){ if(!failed.includes(s.id)) failed.push(s.id); continue; }
      const prev = state.fetched[s.id] || {};
      state.fetched[s.id] = {
        ...prev,
        price: Number(r.price),
        yield_pct: r.yield_pct!=null ? Number(r.yield_pct) : null,
        per: r.per!=null ? Number(r.per) : null,
        as_of: r.as_of || null,
        alert: r.alert || null,
        fetchedAt: now
      };
    }
    await saveState();
    render(); // 途中経過も反映
    if(bi < batches.length-1 && !rateLimited) await sleep(1500); // 連打で500を誘発しないようクールダウン
  }

  // トリガー判定 → 点灯銘柄のみ深掘り（ノイズ遮断：未点灯は何もしない）。枠切れ中は深掘りも行わない
  const lit = litStocks();
  if(!rateLimited){
    for(let i=0;i<lit.length && !rateLimited; i++){
      const s = lit[i];
      prog.textContent = `点灯銘柄を深掘り中… ${s.name}（${i+1}/${lit.length}）`;
      try{
        const text = await callClaude(buildDipPrompt(s), true);
        const j = parseJsonLoose(text);
        if(j.summary){
          state.fetched[s.id].dip_summary = j.summary;
          state.fetched[s.id].dip_at = Date.now();
        }
      }catch(e){
        if(e.status === 429){ rateLimited = true; resetsAtSec = e.resetsAt; errors.push('深掘り中に枠切れ（429）'); }
        else console.error('dip fail', s.id, e);
      }
    }
  }

  // ログ追記
  const prices = {};
  state.stocks.forEach(s=>{ const f=state.fetched[s.id]; if(f&&f.price!=null) prices[s.id]=f.price; });
  const anoms = anomStocks().map(s=>s.id);
  state.logs.unshift({
    ts: now, type:'update',
    scope: scopeLabel || `個別・${target.length}件`,
    prices,
    fx: state.fx?.rate ?? null,
    triggered: lit.map(s=>`${s.name}(${s.id})`),
    anomalies: anoms,
    failed,
    errors,
    rateLimited,
    resetsAt: resetsAtSec
  });
  if(state.logs.length > 200) state.logs.length = 200;
  await saveState();

  prog.textContent = '';
  btns.forEach(b=>b && (b.disabled = false));
  render();
  const msgs = [];
  if(lit.length) msgs.push(`🔔 ${lit.length}銘柄が点灯`);
  if(anoms.length) msgs.push(`🚨 異常検知 ${anoms.length}件`);
  if(failed.length) msgs.push(`⚠️ ${failed.length}銘柄取得失敗（詳細はログタブ）`);
  if(rateLimited){
    const t = fmtResetTime(resetsAtSec);
    toast(`⏸️ 枠切れ（429）で中断${t?`。${t}頃に復活見込み`:''}。取得済み分だけ反映済み`);
  } else if(errors.length && failed.length === state.stocks.length){
    toast(`❌ 自動更新は不通。設定タブの「手動更新モード」を使って`);
  } else {
    toast(msgs.length ? msgs.join(' / ') : '✅ 更新完了・点灯なし');
  }
}

/* ============ 決算カレンダー ============ */
function parseEarnings(s){
  if(!s) return null;
  let m = s.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return {d:new Date(+m[1], +m[2]-1, +m[3]), exact:true};
  m = s.match(/(\d{4})-(\d{2})/);
  if(m){
    let day = 15;
    if(s.includes('上旬')) day = 5;
    else if(s.includes('中旬')) day = 15;
    else if(s.includes('下旬')||s.includes('末')) day = 25;
    return {d:new Date(+m[1], +m[2]-1, day), exact:false};
  }
  return null;
}

    fxBox.innerHTML = `USD/JPY<br><b>${state.fx.rate.toFixed(1)}</b><br><span style="font-size:9px">${hot?'160円台＝海外株見送り帯':'取得 '+fmtTs(state.fx.fetchedAt)}</span>`;
  } else {
    fxBox.className='fx'; fxBox.innerHTML = 'USD/JPY<br><b>—</b>';

    meta.innerHTML = `最終更新 <span class="${stale?'stale':''}">${fmtTs(last.ts)}${stale?' ⚠️24h超':''}</span>`;
  } else meta.textContent = '未更新（「更新」で実勢取得）';
}

function renderHome(){

    html += `<div class="alert-band err"><div class="t red">🚨 異常検知（要確認・日新電機事件の再発防止）</div><ul>` +

    html += `<div class="alert-band"><div class="t amber">🔔 トリガー点灯中</div><ul>` +

function renderCard(s){
  const f = state.fetched[s.id] || {};
  const isLit = (s.triggers||[]).some(t=>evalTrigger(s,t).hit);
  const isAnom = !!f.alert;
  const priceStale = f.fetchedAt && age(f.fetchedAt) > H24;
  const indStale = f.fetchedAt && age(f.fetchedAt) > D7;

  let badge;
  if(isAnom) badge = `<span class="badge anom-b">🚨 異常</span>`;
  else if(isLit) badge = `<span class="badge lit-b">🔔 点灯</span>`;
  else badge = `<span class="badge ok-b">静観</span>`;

  const priceHtml = f.price!=null
    ? `<span class="p">${fmtPrice(f.price, s.market)}</span><span class="c-asof ${priceStale?'stale':''}">取得 ${fmtTs(f.fetchedAt)}${f.as_of?` / 実勢${esc(f.as_of)}`:''}${priceStale?' ⚠️古い':''}</span>`
    : `<span class="p none">未取得</span>`;

  let ind = '';
  if(f.yield_pct!=null || f.per!=null){
    const parts = [];
    if(f.yield_pct!=null) parts.push(`利回り ${f.yield_pct}%`);
    if(f.per!=null) parts.push(`PER ${f.per}倍`);
    ind = `<div class="c-ind"><span class="${indStale?'stale':''}">${parts.join(' ／ ')}${indStale?' ⚠️1週間超':''}</span></div>`;
  }

  let hold = '';
  if(s.holding && s.holding.shares && s.holding.avg_cost){
    let pl = '';
    if(f.price!=null){
      const diff = (f.price - s.holding.avg_cost) * s.holding.shares;
      const pct = (f.price/s.holding.avg_cost - 1)*100;
      pl = ` ／ <span class="${diff>=0?'pos':'neg'}">${diff>=0?'+':''}${Math.round(diff).toLocaleString()}円 (${pct>=0?'+':''}${pct.toFixed(1)}%)</span>`;
    }
    hold = `<div class="c-hold">保有 ${s.holding.shares.toLocaleString()}株 @${s.holding.avg_cost}${s.holding.monthly_add?` ／ 月+${s.holding.monthly_add}株積立`:''}${pl}</div>`;
  } else if(s.holding && s.holding.avg_cost){
    hold = `<div class="c-hold">取得 @${s.holding.avg_cost}</div>`;
  }

  let trgHtml = '';
  if((s.triggers||[]).length){
    trgHtml = `<div class="trg">` + s.triggers.map(t=>{
      const ev = evalTrigger(s,t);
      let fill = 0, distTxt = '—';
      if(ev.dist!=null){
        // 距離30%で0%、トリガー到達で100%のゲージ
        fill = Math.max(0, Math.min(100, (1 - ev.dist/30) * 100));
        if(ev.hit) fill = 100;
        distTxt = ev.hit ? '点灯' : `-${ev.dist.toFixed(1)}%`;
      }
      return `<div class="trg-row ${ev.hit?'hit':''}">
        <div class="trg-lbl">${esc(t.label)} <b>${t.value.toLocaleString()}</b></div>
        <div class="gauge"><i style="width:${fill}%"></i></div>
        <div class="trg-dist">${distTxt}</div>
      </div>`;
    }).join('') + `</div>`;
  }

  let dipHtml = '';
  if(isLit){
    dipHtml = `<div class="dip"><h4>📋 下落時チェック項目</h4><ul>` +
      (s.dip_checklist||[]).map(c=>`<li>${esc(c)}</li>`).join('') + `</ul>`;
    if(f.dip_summary){
      dipHtml += `<div class="sum">${esc(f.dip_summary)}</div><div class="sum-asof">要約取得 ${fmtTs(f.dip_at)}</div>`;
    } else {
      dipHtml += `<div class="sum" style="color:var(--muted)">「更新」でニュース要約を取得</div>`;
    }
    dipHtml += `</div>`;
  }

  const anomHtml = isAnom ? `<div class="anom-msg">🚨 ${esc(f.alert)}</div>` : '';

  return `<div class="card ${isLit?'lit':''} ${isAnom?'anom':''}">
    <div class="c-head"><span class="c-name">${esc(s.name)}</span><span class="c-code">${esc(s.id)}${s.market==='US'?' 🇺🇸':''}</span>${badge}</div>
    <div class="c-price">${priceHtml}</div>
    ${ind}${hold}
    <div class="c-thesis">${esc(s.thesis)}</div>
    ${trgHtml}${anomHtml}${dipHtml}
    ${s.notes?`<div class="c-notes">📝 ${esc(s.notes)}</div>`:''}
    <div class="card-foot"><button class="card-upd" data-sid="${esc(s.id)}">🔄 この銘柄だけ更新</button></div>
  </div>`;
}

function renderCal(){
  const today = new Date(); today.setHours(0,0,0,0);
  const tomorrow = new Date(today.getTime()+86400000);
  const rows = state.stocks
    .map(s=>({s, e:parseEarnings(s.earnings_next)}))
    .filter(x=>x.e)
    .sort((a,b)=>a.e.d-b.e.d);
  if(!rows.length) return `<div class="empty">決算予定なし</div>`;
  return rows.map(({s,e})=>{
    const isNow = e.exact && e.d >= today && e.d <= tomorrow;
    const isPast = e.d < today && !isNow;
    const chk = (s.dip_checklist||[]).join(' / ');
    return `<div class="cal-row ${isNow?'now':''} ${isPast?'cal-past':''}">
      <div class="cal-date">${esc(s.earnings_next)}</div>
      <div style="flex:1;min-width:0">
        <div class="cal-name">${esc(s.name)} <span class="c-code">${esc(s.id)}</span></div>
        ${chk?`<div class="cal-chk">👀 ${esc(chk)}</div>`:''}
      </div>
      ${isNow?`<span class="cal-now-tag">チェックせよ</span>`:''}
    </div>`;
  }).join('');
}

function renderLog(){
  let html = `<div class="memo-box"><input id="memoIn" placeholder="手動メモを追記…" maxlength="500"><button id="memoBtn">追記</button></div>`;
  if(!state.logs.length) return html + `<div class="empty">ログなし。更新するとここに履歴が残る</div>`;
  html += state.logs.map(l=>{
    if(l.type==='memo'){
      return `<div class="log-entry"><div class="log-ts">📝 ${fmtTs(l.ts)}</div><div class="log-body">${esc(l.memo)}</div></div>`;
    }
    const ps = Object.entries(l.prices||{}).map(([id,p])=>{
      const st = state.stocks.find(s=>s.id===id);
      return `${st?st.name:id} ${p}`;
    }).join(' / ');
    let body = ps || '取得なし';
    if(l.fx) body += `\nUSDJPY ${l.fx}`;
    if(l.triggered && l.triggered.length) body += `\n<b>🔔 点灯: ${esc(l.triggered.join('、'))}</b>`;
    if(l.anomalies && l.anomalies.length) body += `\n🚨 異常: ${esc(l.anomalies.join('、'))}`;
    if(l.rateLimited){
      const t = fmtResetTime(l.resetsAt);
      body += `\n⏸️ 枠切れ（429）で中断${t?`・${t}頃に復活見込み`:''}`;
    }
    if(l.failed && l.failed.length) body += `\n⚠️ 取得失敗: ${esc(l.failed.join('、'))}`;
    if(l.errors && l.errors.length) body += `\n❌ ${esc(l.errors.join('\n❌ '))}`;
    return `<div class="log-entry"><div class="log-ts">${l.manual?'✍️':'🔄'} ${fmtTs(l.ts)}${l.manual?'（手動）':''}${l.scope?` ・ ${esc(l.scope)}`:''}</div><div class="log-body">${body}</div></div>`;
  }).join('');
  return html;
}

/* ============ events ============ */
function bindMain(){
  if(curTab==='home'){
    document.querySelectorAll('.card-upd').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const stock = state.stocks.find(s=>s.id===btn.dataset.sid);
        if(!stock) return;
        runUpdateSafe([stock], `個別・${stock.name}`);
      });
    });
  }
  if(curTab==='log'){
    $('#memoBtn')?.addEventListener('click', async ()=>{
      const v = $('#memoIn').value.trim();
      if(!v) return;
      state.logs.unshift({ts:Date.now(), type:'memo', memo:v});
      render(); toast('メモを追記した'); saveState();
    });
  }
  if(curTab==='set'){
    // トリガー編集（変更即state反映→保存）
    document.querySelectorAll('.set-trow').forEach(row=>{
      const sid = row.dataset.sid, ti = +row.dataset.ti;
      const stock = state.stocks.find(s=>s.id===sid);
      row.querySelector('.in-lbl').addEventListener('change', async e=>{
        stock.triggers[ti].label = e.target.value; await saveState(); toast('保存した');
      });
      row.querySelector('.in-val').addEventListener('change', async e=>{
        const v = parseFloat(e.target.value);
        if(!isNaN(v)){ stock.triggers[ti].value = v; await saveState(); toast('保存した'); }
      });
      row.querySelector('.del').addEventListener('click', async ()=>{
        stock.triggers.splice(ti,1); await saveState(); render(); toast('トリガー削除');
      });
    });
    document.querySelectorAll('.set-add').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const stock = state.stocks.find(s=>s.id===btn.dataset.sid);
        stock.triggers = stock.triggers||[];
        stock.triggers.push({type:'price_below', value:0, label:'新トリガー'});
        await saveState(); render();
      });
    });
    const pingOut = msg => { const el=$('#pingResult'); if(el) el.textContent = msg; };
    // 貼り付けボタン（スマホでtextarea直貼りが効かない対策）
    const pasteInto = async (targetSel) => {
      try{
        const txt = await navigator.clipboard.readText();
        if(!txt) return toast('クリップボードが空');
        $(targetSel).value = txt;
        toast('貼り付けた');
      }catch(e){
        // 権限拒否 or サンドボックス制限
        const ta = $(targetSel);
        ta.focus();
        toast('⚠️ 自動貼り付け不可（権限）→ 欄を長押しして「ペースト」で');
      }
    };
    $('#btnPasteManual')?.addEventListener('click', ()=>pasteInto('#manualArea'));
    $('#btnPasteIo')?.addEventListener('click', ()=>pasteInto('#ioArea'));
    // 手動更新モード
    $('#btnCopyPrompt')?.addEventListener('click', async ()=>{
      if(!state.stocks.length) return toast('銘柄データが空。先にインポートして');
      const lines = state.stocks.map(s=>`- ${s.id} ${s.name}（${s.market==='JP'?'東証':'米国市場'}）`).join('\n');
      const p = `以下の銘柄の「現在株価」「予想配当利回り(%)」「予想PER」をweb検索で調べて、JSONのみで返答して。前置き・説明・Markdownフェンス禁止。\n形式: {"9432": {"price": 148.0, "yield_pct": 3.65, "per": 12.1, "as_of": "2026-07-19", "alert": null}}\nルール: 東証銘柄は円建て、米国銘柄はUSD建て。不明な値はnull。上場廃止・取引停止・TOB等の異常があればalertに日本語で記載。\nさらに "USDJPY" キーで現在のドル円レートを {"price": 162.4, "as_of": "..."} 形式で含めること。\n銘柄:\n${lines}`;
      try{ await navigator.clipboard.writeText(p); toast('コピーした。チャットのClaudeに貼って聞いて'); }
      catch(e){ $('#manualArea').value = p; toast('クリップボード不可→下の欄に出したので手動コピーして'); }
    });
    $('#btnManualApply')?.addEventListener('click', async ()=>{
      const v = $('#manualArea').value.trim();
      if(!v) return toast('JSONを貼ってから適用');
      let parsed;
      try{ parsed = parseJsonLoose(v); }
      catch(e){ return toast('❌ JSONパース失敗: '+e.message); }
      const now = Date.now();
      let applied = 0;
      if(parsed.USDJPY && parsed.USDJPY.price != null){
        state.fx = { rate: Number(parsed.USDJPY.price), as_of: parsed.USDJPY.as_of||null, fetchedAt: now };
      }
      for(const s of state.stocks){
        const r = parsed[s.id];
        if(!r || r.price == null) continue;
        const prev = state.fetched[s.id] || {};
        state.fetched[s.id] = { ...prev,
          price: Number(r.price),
          yield_pct: r.yield_pct!=null ? Number(r.yield_pct) : null,
          per: r.per!=null ? Number(r.per) : null,
          as_of: r.as_of || null,
          alert: r.alert || null,
          fetchedAt: now };
        applied++;
      }
      if(!applied) return toast('⚠️ 適用できる銘柄がなかった（idキーを確認）');
      const lit = litStocks();
      const prices = {};
      state.stocks.forEach(s=>{ const f=state.fetched[s.id]; if(f&&f.price!=null) prices[s.id]=f.price; });
      state.logs.unshift({ ts: now, type:'update', manual:true, prices,
        fx: state.fx?.rate ?? null,
        triggered: lit.map(s=>`${s.name}(${s.id})`),
        anomalies: anomStocks().map(s=>s.id), failed:[], errors:[] });
      if(state.logs.length > 200) state.logs.length = 200;
      render(); // ← 先に画面反映（保存待ちでフリーズさせない）
      toast(`✅ ${applied}銘柄を手動適用${lit.length?` / 🔔 ${lit.length}銘柄点灯`:''}`);
      saveState(); // 裏で保存（タイムアウト保護つき）
    });
    $('#btnPing')?.addEventListener('click', async ()=>{
      pingOut('① 実行中…');
      try{
        const t = await callClaude('JSONのみで返答: {"ok": true}', false);
        const j = parseJsonLoose(t);
        pingOut(j.ok ? '① ✅ API疎通OK。次は②を試して。' : '① ⚠️ 応答はあるが想定外: '+t.slice(0,100));
      }catch(e){
        pingOut('① ❌ 失敗: '+e.message+'\n→ Claudeアプリ内のアーティファクトとして開いているか確認。ローカルでは動かない。');
      }
    });
    $('#btnPing2')?.addEventListener('click', async ()=>{
      pingOut('② 実行中…（web検索を含むので少し待つ）');
      try{
        const t = await callClaude('NTT（9432）の現在株価をweb検索し、JSONのみで返答: {"price": 数値}', true);
        const j = parseJsonLoose(t);
        pingOut(j.price!=null ? `② ✅ 検索つきもOK（NTT ${j.price}円）。更新が失敗する場合はログタブのエラー詳細を見て。` : '② ⚠️ パースできたがprice無し: '+t.slice(0,100));
      }catch(e){
        pingOut('② ❌ 失敗: '+e.message);
      }
    });
    $('#btnExport')?.addEventListener('click', ()=>{
      $('#ioArea').value = JSON.stringify(state, null, 2);
      toast('画面に表示した（コピーか「ファイル保存」でダウンロードして）');
    });
    $('#btnDownload')?.addEventListener('click', ()=>{
      const json = JSON.stringify(state, null, 2);
      const blob = new Blob([json], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const ts = new Date();
      const stamp = `${ts.getFullYear()}-${String(ts.getMonth()+1).padStart(2,'0')}-${String(ts.getDate()).padStart(2,'0')}`;
      a.href = url;
      a.download = `portfolio-backup_${stamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('📥 ダウンロードした');
    });
    $('#btnFilePick')?.addEventListener('click', ()=> $('#filePicker').click());
    $('#filePicker')?.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => { $('#ioArea').value = ev.target.result; toast('ファイルを読み込んだ。内容を確認して「インポート実行」を押して'); };
      reader.onerror = () => toast('❌ ファイル読込失敗');
      reader.readAsText(file);
      e.target.value = '';
    });
    $('#btnCopy')?.addEventListener('click', async ()=>{
      const v = $('#ioArea').value;
      if(!v) return toast('先に「画面に表示」を押して');
      try{ await navigator.clipboard.writeText(v); toast('コピーした'); }
      catch(e){ $('#ioArea').select(); toast('選択したので手動コピーして'); }
    });
    $('#btnImport')?.addEventListener('click', async ()=>{
      const v = $('#ioArea').value.trim();
      if(!v) return toast('JSONを貼ってから実行');
      try{
        const j = JSON.parse(v);
        if(!Array.isArray(j.stocks)) throw new Error('stocks配列がない');
        j.fetched = j.fetched||{}; j.logs = j.logs||[];
        state = j;
        render(); toast('✅ インポート完了（上書きした）'); saveState();
      }catch(e){ toast('❌ インポート失敗: '+e.message); }
    });
  }
}

document.querySelectorAll('nav button').forEach(b=>{
  b.addEventListener('click', ()=>{
    curTab = b.dataset.tab;
    document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on', x===b));
    render();
  });
});
function stocksByTier(tier){ return state.stocks.filter(s=>s.tier===tier); }
function runUpdateSafe(target, scopeLabel){
  return runUpdate(target, scopeLabel).catch(e=>{
    $('#progress').textContent='';
    [$('#btnUpdCore'),$('#btnUpdWatch'),$('#btnUpdLottery'),$('#btnUpdAll')].forEach(b=>b&&(b.disabled=false));
    toast('❌ 更新エラー: '+e.message);
  });
}
$('#btnUpdCore')?.addEventListener('click', ()=>{
  const t = stocksByTier('core');
  if(!t.length) return toast('本命枠の銘柄が登録されていない');
  runUpdateSafe(t, `🎯本命・${t.length}件`);
});
$('#btnUpdWatch')?.addEventListener('click', ()=>{
  const t = stocksByTier('watch');
  if(!t.length) return toast('ウォッチ枠の銘柄が登録されていない');
  runUpdateSafe(t, `🟡ウォッチ・${t.length}件`);
});
$('#btnUpdLottery')?.addEventListener('click', ()=>{
  const t = stocksByTier('lottery');
  if(!t.length) return toast('宝くじ枠の銘柄が登録されていない');
  runUpdateSafe(t, `🎰宝くじ・${t.length}件`);
});
$('#btnUpdAll')?.addEventListener('click', ()=>{
  const n = state.stocks.length;
  if(!n) return toast('銘柄データが空。先にインポートして');
  const ok = window.confirm(
    `全銘柄（${n}件）をweb検索で更新します。\n` +
    `トークン消費は大きめ（5時間の利用枠を数十%使う実績あり）。\n` +
    `本命／ウォッチ／宝くじを個別に更新する方が軽く済みます。\n\n` +
    `このまま全銘柄を実行しますか？`
  );
  if(!ok) return;
  runUpdateSafe(state.stocks, `全銘柄・${n}件`);
});

/* ============ init ============ */
(async ()=>{
  checkEnv();
  await loadState();
  render();
})();
</script>
</body>
</html>
